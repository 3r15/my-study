<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정처산기">
<link rel="manifest" href="manifest.webmanifest">
<title>정보처리산업기사 필기 학습</title>
<style>
:root{
  --bg:#0f172a; --bg2:#111c33; --card:#16213c; --card2:#1c2b4a;
  --line:#26365a; --tx:#e6edf7; --tx2:#9fb0cc; --tx3:#6b7fa3;
  --ac:#5b9cff; --ok:#31c48d; --no:#f26d6d; --wn:#f0b429; --pu:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.6; padding-bottom:72px;
}
a{color:var(--ac);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:840px;margin:0 auto;padding:0 14px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;height:52px}
.hd h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
.hd .sp{flex:1}
.hd button{background:none;border:none;color:var(--tx2);font-size:13px;padding:6px 8px;border-radius:8px}
.hd button:hover{background:var(--card)}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(15,23,42,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:840px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--tx3);font-size:11px;font-weight:600}
nav a.on{color:var(--ac)}
nav a i{font-style:normal;font-size:19px;line-height:1}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.tight{padding:11px 12px}
h2.sec{font-size:13px;color:var(--tx2);margin:20px 0 8px;font-weight:700;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--tx2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:10px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#06162f}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.gh{background:transparent}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.chip.s1{color:#7ab8ff;border-color:#2b4a7a}
.chip.s2{color:#8ee6b8;border-color:#245f45}
.chip.s3{color:#d6b0ff;border-color:#4b3676}
.chip.ok{color:var(--ok);border-color:#245f45}
.chip.no{color:var(--no);border-color:#6d2b2b}
.bar{height:6px;background:#1d2b48;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px}
input,textarea,select{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.hide{display:none!important}

/* question */
.qhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-weight:800;font-size:15px;color:var(--ac)}
.stem{font-size:15.5px;line-height:1.65;word-break:break-word}
.stem p{margin:0 0 8px}
pre.code{background:#0b1425;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:10px 0;
  overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;color:#cfe0f7;white-space:pre}
.note{background:#0d1830;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px;color:#d4e0f2;white-space:pre-wrap}
table.qt{border-collapse:collapse;margin:10px 0;font-size:13px;width:auto;max-width:100%;display:block;overflow-x:auto}
table.qt td,table.qt th{border:1px solid var(--line);padding:5px 10px;white-space:nowrap;text-align:center}
table.qt tr:first-child td{background:var(--card2);font-weight:700}
.qimg{max-width:100%;background:#fff;border-radius:8px;margin:10px 0;display:block;padding:6px}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:9px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:left;width:100%;color:var(--tx);font-size:14.5px;line-height:1.55}
.opt:hover{border-color:#3c5a92}
.opt b{color:var(--tx2);flex:none;font-weight:700}
.opt.sel{border-color:var(--ac);background:#16294a}
.opt.right{border-color:var(--ok);background:#102f22}
.opt.right b{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:#331616}
.opt.wrong b{color:var(--no)}
.opt .why{display:block;font-size:11.5px;color:var(--tx3);margin-top:3px}
.fb{margin-top:12px;border-radius:11px;padding:11px 13px;font-size:13.5px;border:1px solid var(--line);background:var(--card2)}
.fb.ok{border-color:#245f45;background:#10281f}
.fb.no{border-color:#6d2b2b;background:#2a1414}

/* list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:7px 0;width:100%;text-align:left;color:var(--tx)}
.lrow:hover{border-color:var(--ac)}
.lrow .g{flex:1;min-width:0}
.lrow .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.pill{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-ms-overflow-style:none;scrollbar-width:none}
.pill::-webkit-scrollbar{display:none}
.pill button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--tx2);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill button.on{background:var(--ac);border-color:var(--ac);color:#06162f}
.empty{text-align:center;color:var(--tx3);padding:40px 10px;font-size:13.5px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.kpi .k{font-size:11px;color:var(--tx3);margin-top:2px}
details.sm summary{cursor:pointer;font-size:12.5px;color:var(--tx2);padding:4px 0}
.sticky-bot{position:fixed;left:0;right:0;bottom:56px;z-index:40;background:rgba(15,23,42,.97);border-top:1px solid var(--line);padding:9px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;background:#233a63;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
mark{background:#3c4f2a;color:#e9ffcf;border-radius:3px;padding:0 2px}
</style>
</head>
<body>
<header><div class="wrap hd">
  <h1 id="hTitle">정보처리산업기사 필기</h1><div class="sp"></div>
  <button onclick="go('#/settings')">⚙</button>
</div></header>

<main id="app" class="wrap"><div class="empty">불러오는 중…</div></main>

<nav><div class="in">
  <a href="#/home"     data-tab="home"><i>◎</i>홈</a>
  <a href="#/exams"    data-tab="exams"><i>✎</i>기출문제</a>
  <a href="#/summary"  data-tab="summary"><i>▤</i>핵심요약</a>
  <a href="#/analysis" data-tab="analysis"><i>◈</i>오답분석</a>
  <a href="#/notes"    data-tab="notes"><i>✦</i>학습노트</a>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   1. 저장소 (localStorage) — 학습 기록 · 취약점 · 메모
   ══════════════════════════════════════════════════════════ */
const KEY='jbsg_v2';
const DEF={answers:{},notes:{},secNotes:{},secRead:{},weak:{},gen:[],genAns:{},unknown:[],studyNotes:{},ver:2};
let S=load();
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign({},DEF)}}
let _sv;function save(){clearTimeout(_sv);_sv=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(S)),120)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}

/* ══════════════════════════════════════════════════════════
   2. 데이터 로딩
   ══════════════════════════════════════════════════════════ */
const D={index:null,exams:{},summary:null,sec:{},gloss:null,qById:{}};
const j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' → HTTP '+r.status);return r.json()});
async function boot(){
  try{
    [D.index,D.summary]=await Promise.all([j('data/index.json'),j('data/summary.json')]);
  }catch(e){ return bootFail(e) }
  D.summary.forEach(s=>D.sec[s.no]=s);
  window.addEventListener('hashchange',route); route();
  if('serviceWorker' in navigator&&location.protocol!=='file:')
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  // 첫 화면을 그린 뒤 남는 시간에 회차 데이터를 미리 받아둔다
  // (랜덤·취약 개념 모드가 12개 파일을 필요로 하므로)
  const idle=window.requestIdleCallback||(f=>setTimeout(f,800));
  idle(()=>{ D.index.exams.forEach((e,i)=>setTimeout(()=>getExam(e.id).catch(()=>{}),i*120)) });
}
// 용어사전은 해당 탭에 들어갈 때만 (초기 로딩 21KB 절약)
async function needGloss(){ if(!D.gloss) D.gloss=await j('data/glossary.json'); return D.gloss }
function bootFail(e){
  const local=location.protocol==='file:';
  document.getElementById('app').innerHTML=`
  <div class="card" style="margin-top:24px;border-color:#6d2b2b">
    <h3 style="margin:0 0 8px;font-size:16px;color:var(--no)">데이터를 불러오지 못했습니다</h3>
    ${local?`<p class="small">브라우저가 <code>file://</code>로 열린 파일에서는 보안 정책(CORS)상 데이터 파일을 읽지 못합니다.
      <b>index.html을 더블클릭해서 여는 방식으로는 동작하지 않습니다.</b></p>
      <p class="small" style="margin-top:10px">study-site 폴더에서 아래 명령을 실행하고
      <a href="http://localhost:8000">http://localhost:8000</a> 으로 접속하세요.</p>
      <pre class="code">python -m http.server 8000</pre>
      <p class="small muted">또는 GitHub Pages에 올리면 바로 됩니다 (README 참고).</p>`
    :`<p class="small">${esc(e.message)}</p>
      <p class="small muted">data/ 폴더가 index.html과 같은 위치에 있는지 확인해 주세요.</p>`}
  </div>`;
}
async function getExam(id){
  if(D.exams[id])return D.exams[id];
  const e=await j(`data/exam-${id}.json`);
  e.questions.forEach(q=>{q.exam=id;q.qid=`${id}-${String(q.no).padStart(2,'0')}`;D.qById[q.qid]=q;});
  D.exams[id]=e; return e;
}
async function allQuestions(){
  await Promise.all(D.index.exams.map(e=>getExam(e.id)));
  return D.index.exams.flatMap(e=>D.exams[e.id].questions);
}

/* ══════════════════════════════════════════════════════════
   3. 렌더 유틸
   ══════════════════════════════════════════════════════════ */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CIRC=['①','②','③','④'];
function block(b){
  if(b.type==='text')  return `<p>${esc(b.text)}</p>`;
  if(b.type==='code')  return `<pre class="code">${esc(dedent(b))}</pre>`;
  if(b.type==='note')  return `<div class="note">${esc(b.lines.join('\n'))}</div>`;
  if(b.type==='image') return `<img class="qimg" src="img/${esc(b.src)}" loading="lazy" style="max-width:${Math.min(100,Math.round(b.w*1.55))}%">`;
  if(b.type==='table'){
    return `<table class="qt"><tbody>${b.grid.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return '';
}
function dedent(b){
  const ind=b.indents||[];const m=ind.length?Math.min(...ind):0;
  return b.lines.map((l,i)=>' '.repeat(Math.max(0,Math.round(((ind[i]||m)-m)/5.3)*2))+l).join('\n');
}
const stemHtml=q=>q.stem.map(block).join('');
const subjChip=n=>`<span class="chip s${n}">${n}과목</span>`;
const secTitle=n=>D.sec[n]?D.sec[n].title:('#'+n);

/* ══════════════════════════════════════════════════════════
   4. 채점 + 취약점 기록  ★ 3번 영역의 핵심 ★
   각 선택지에 미리 계산된 refs(핵심요약 섹션 번호)가 붙어 있어서
   "내가 고른 오답이 어떤 개념인지"를 그대로 취약점으로 기록한다.
   ══════════════════════════════════════════════════════════ */
// 부정형 문항("~이 아닌 것은?")은 정답 선택지가 오히려 '틀린 설명'이라
// 정답 선택지의 개념을 취약점으로 잡으면 노이즈가 된다.
const NEG=/아닌|않는|않은|틀린|잘못|거리가 먼/;
function isNeg(q){return NEG.test(q.stem.filter(b=>b.type==='text').map(b=>b.text).join(' '))}
function grade(q,sel){
  const ok=(sel===q.answer);
  S.answers[q.qid]={sel,ok,t:Date.now(),exam:q.exam,no:q.no,sub:q.subjectNo,unit:q.unit};
  const bump=(n,w)=>{if(!n)return;S.weak[n]=Math.max(0,(S.weak[n]||0)+w)};
  if(!ok){
    // ① 내가 고른 오답의 개념 → 이걸 "옳다"고 착각했다
    (q.options[sel-1].refs||[]).forEach(n=>bump(n,3));
    // ② 정답 선택지의 개념 → 이걸 몰랐다 (부정형 문항은 제외)
    if(!isNeg(q))(q.options[q.answer-1].refs||[]).forEach(n=>bump(n,2));
    // ③ 문제 전체 주제
    (q.refs||[]).slice(0,1).forEach(n=>bump(n,2));
  }else{
    (q.refs||[]).forEach(n=>bump(n,-1));
  }
  save(); return ok;
}
// "왜 틀렸나요?" — 단순 실수는 취약 점수에서 되돌린다
function whyWrong(qid,kind){
  const q=D.qById[qid]; if(!q)return;
  const a=S.answers[qid]; if(!a)return;
  a.why=kind;
  if(kind==='mistake'){ // 개념은 아는데 실수 → 오답 가중치 되돌리기
    const undo=(n,w)=>{if(n)S.weak[n]=Math.max(0,(S.weak[n]||0)-w)};
    (q.options[a.sel-1]&&q.options[a.sel-1].refs||[]).forEach(n=>undo(n,3));
    if(!isNeg(q))(q.options[q.answer-1].refs||[]).forEach(n=>undo(n,2));
    (q.refs||[]).slice(0,1).forEach(n=>undo(n,2));
  }else if(kind==='concept'){ // 아예 몰랐음 → 주제에 더 무겁게
    (q.refs||[]).slice(0,2).forEach(n=>S.weak[n]=(S.weak[n]||0)+2);
  }
  save();
  const el=document.getElementById('whyBox');
  if(el)el.innerHTML=`<span class="tiny" style="color:var(--ok)">✔ ${({concept:'개념을 몰랐음',confuse:'헷갈렸음',mistake:'단순 실수 — 취약 점수에서 제외'})[kind]}으로 기록했습니다</span>`;
}
function stat(){
  const a=Object.values(S.answers);
  return {n:a.length,ok:a.filter(x=>x.ok).length,rate:a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0};
}
function weakList(min=1){
  return Object.entries(S.weak).map(([n,v])=>({no:+n,v,sec:D.sec[+n]}))
    .filter(x=>x.v>=min&&x.sec).sort((a,b)=>b.v-a.v);
}
function unitStats(){
  const m={};
  Object.values(S.answers).forEach(a=>{const u=a.unit||'기타';(m[u]=m[u]||{n:0,ok:0,sub:a.sub}).n++;if(a.ok)m[u].ok++});
  return Object.entries(m).map(([u,v])=>({unit:u,...v,rate:Math.round(v.ok/v.n*100)})).sort((a,b)=>a.rate-b.rate);
}

/* ══════════════════════════════════════════════════════════
   5. 라우팅
   ══════════════════════════════════════════════════════════ */
const app=()=>document.getElementById('app');
function go(h){location.hash=h}
function qs(h){const i=h.indexOf('?');return i<0?{}:Object.fromEntries(new URLSearchParams(h.slice(i+1)))}
function route(){
  const h=location.hash||'#/home', p=h.split('?')[0].split('/')[1]||'home', a=qs(h);
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',
     x.dataset.tab===p||(p==='play'&&x.dataset.tab==='exams')||(p==='sec'&&x.dataset.tab==='summary')
     ||(p==='glossary'&&x.dataset.tab==='summary')||(p==='gen'&&x.dataset.tab==='analysis')));
  window.scrollTo(0,0);
  ({home:vHome,exams:vExams,play:vPlay,summary:vSummary,sec:vSec,glossary:vGloss,
    analysis:vAnalysis,gen:vGen,notes:vNotes,settings:vSettings}[p]||vHome)(a);
}

/* ══════════════════════════════════════════════════════════
   6. 홈
   ══════════════════════════════════════════════════════════ */
function vHome(){
  const st=stat(), w=weakList(3).slice(0,5), us=unitStats().filter(u=>u.n>=3).slice(0,4);
  const read=Object.keys(S.secRead).length;
  app().innerHTML=`
  <h2 class="sec">학습 현황</h2>
  <div class="grid3">
    <div class="kpi"><div class="v">${st.n}</div><div class="k">푼 문제</div></div>
    <div class="kpi"><div class="v" style="color:${st.rate>=60?'var(--ok)':'var(--wn)'}">${st.rate}%</div><div class="k">정답률</div></div>
    <div class="kpi"><div class="v">${read}<span style="font-size:13px;color:var(--tx3)">/193</span></div><div class="k">요약 학습</div></div>
  </div>
  <h2 class="sec">바로 시작</h2>
  <div class="grid2">
    <button class="btn pri" onclick="go('#/play?mode=random&n=20')">랜덤 20문항</button>
    <button class="btn" onclick="go('#/play?mode=wrong')">틀린 문제 다시</button>
    <button class="btn" onclick="go('#/play?mode=weak&n=20')">취약 개념 집중</button>
    <button class="btn" onclick="go('#/gen')">문제 자동 생성</button>
  </div>
  <h2 class="sec">최근 회차</h2>
  ${D.index.exams.slice(0,4).map(e=>examRow(e)).join('')}
  <div style="text-align:center;margin:8px 0"><button class="btn gh sm" onclick="go('#/exams')">전체 12회차 보기 →</button></div>
  ${w.length?`<h2 class="sec">취약 개념 TOP ${w.length}</h2>${w.map(x=>`

let P=null;
async function vPlay(a){
  app().innerHTML='<div class="empty">문제를 준비하는 중…</div>';
  let list=[],title='';
  if(a.mode==='exam'){const e=await getExam(a.id);list=e.questions.slice();title=e.title+' 기출';}
  else{
    const all=await allQuestions();
    if(a.mode==='random'){list=shuffle(all).slice(0,+a.n||20);title='랜덤 '+list.length+'문항';}
    else if(a.mode==='subject'){list=shuffle(all.filter(q=>q.subjectNo==a.sub)).slice(0,+a.n||30);title=a.sub+'과목 랜덤';}
    else if(a.mode==='unit'){const u=decodeURIComponent(a.unit);list=shuffle(all.filter(q=>q.unit===u));title=u;}
    else if(a.mode==='wrong'){list=all.filter(q=>S.answers[q.qid]&&!S.answers[q.qid].ok);title='틀린 문제 '+list.length+'개';}
    else if(a.mode==='sec'){const n=+a.no;list=all.filter(q=>(q.refs||[]).includes(n));title=secTitle(n)+' 관련';}
    else if(a.mode==='weak'){
      const w=weakList(2).slice(0,12).map(x=>x.no);
      const set=new Set(w);
      let c=all.filter(q=>(q.refs||[]).some(n=>set.has(n)));
      c.sort((x,y)=>{const s=q=>(S.answers[q.qid]?(S.answers[q.qid].ok?2:0):1);return s(x)-s(y)});
      list=c.slice(0,+a.n||20); title='취약 개념 집중';
      if(!list.length){list=shuffle(all).slice(0,20);title='랜덤 20문항 (기록 부족)';}
    }
  }
  if(!list.length){app().innerHTML=`<div class="empty">해당하는 문제가 없습니다.<br><br><button class="btn" onclick="history.back()">돌아가기</button></div>`;return}
  P={list,i:0,title,shown:{}};
  const first=list.findIndex(q=>!S.answers[q.qid]);
  P.i=(a.mode==='exam'&&first>0)?first:0;
  drawQ();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawQ(){
  const q=P.list[P.i], rec=S.answers[q.qid], shown=P.shown[q.qid]||!!rec;
  const sel=shown?(rec?rec.sel:null):null;
  document.getElementById('hTitle').textContent=P.title;
  app().innerHTML=`
  <div class="row" style="margin:12px 0 4px">
    <span class="tiny muted">${P.i+1} / ${P.list.length}</span>
    <div class="bar" style="flex:1"><i style="width:${(P.i+1)/P.list.length*100}%"></i></div>
    <button class="btn sm gh" onclick="go('#/exams')">나가기</button>
  </div>
  <div class="card">
    <div class="qhd">${subjChip(q.subjectNo)}<span class="qno">${q.no}.</span>
      <span class="chip">${esc(q.exam)}</span><span class="chip">${esc(q.unit||'')}</span></div>
    <div class="stem">${stemHtml(q)}</div>
    ${q.optionsImage?`<img class="qimg" src="img/${esc(q.optionsImage)}" loading="lazy">
       <div class="tiny muted" style="margin-bottom:6px">※ 선택지가 그림/표입니다. 위 이미지를 보고 번호를 고르세요.</div>`:''}
    <div class="opts" id="opts">${q.options.map((o,k)=>optHtml(q,o,k+1,sel,shown)).join('')}</div>
    <div id="fb">${shown?fbHtml(q,sel):''}</div>
  </div>
  <div style="height:70px"></div>
  <div class="sticky-bot"><div class="wrap row">
    <button class="btn" onclick="mv(-1)" ${P.i?'':'disabled'}>‹ 이전</button>
    <button class="btn gh sm" onclick="skip()">모르겠음</button>
    <div class="sp" style="flex:1"></div>
    <button class="btn ${shown?'pri':''}" onclick="mv(1)">${P.i===P.list.length-1?'결과 보기':'다음 ›'}</button>
  </div></div>`;
}
function optHtml(q,o,k,sel,shown){
  let cls='opt';
  if(shown){ if(k===q.answer)cls+=' right'; else if(k===sel)cls+=' wrong'; }
  else if(k===sel)cls+=' sel';
  const why=(shown&&k!==q.answer&&k===sel&&(o.refs||[]).length)
    ? `<span class="why">↳ 이 선택지는 「${esc(secTitle(o.refs[0]))}」 개념입니다</span>`:'';
  return `<button class="${cls}" ${shown?'disabled':`onclick="pick(${k})"`}>
    <b>${CIRC[k-1]}</b><span>${esc(o.text)||'<span class="muted">(위 그림 참조)</span>'}${why}</span></button>`;
}
function fbHtml(q,sel){
  const rec=S.answers[q.qid], ok=rec?rec.ok:(sel===q.answer);
  const refs=(q.refs||[]).slice(0,3);
  const miss=!ok&&rec&&rec.sel?(q.options[rec.sel-1].refs||[]):[];
  return `<div class="fb ${ok?'ok':'no'}">
    <b>${ok?'✔ 정답':'✘ 오답'}</b> — 정답은 ${CIRC[q.answer-1]}번입니다.
    ${!ok&&miss.length?`<div class="small" style="margin-top:6px">고른 선택지 개념: <b>${miss.map(n=>esc(secTitle(n))).join(', ')}</b> → 취약 개념으로 기록했습니다.</div>`:''}
    ${!ok?`<div id="whyBox" style="margin-top:9px">
      <div class="tiny muted" style="margin-bottom:5px">왜 틀렸나요?</div>
      <div class="row" style="gap:6px">
        <button class="btn sm" onclick="whyWrong('${q.qid}','concept')">개념을 몰랐다</button>
        <button class="btn sm" onclick="whyWrong('${q.qid}','confuse')">헷갈렸다</button>
        <button class="btn sm" onclick="whyWrong('${q.qid}','mistake')">단순 실수</button>
      </div></div>`:''}
    ${refs.length?`<div class="small" style="margin-top:7px">📖 관련 요약: ${refs.map(n=>`<a href="#/sec?no=${n}">${esc(secTitle(n))}</a>`).join(' · ')}</div>`:''}
    <details class="sm" style="margin-top:8px"><summary>✎ 모르는 내용 메모하기</summary>
      <textarea id="memo" placeholder="왜 틀렸는지, 뭘 몰랐는지 적어두면 오답분석에 모입니다">${esc(S.notes[q.qid]||'')}</textarea>
      <button class="btn sm" style="margin-top:6px" onclick="saveMemo('${q.qid}')">메모 저장</button>
    </details></div>`;
}
function pick(k){
  const q=P.list[P.i]; grade(q,k); P.shown[q.qid]=true; drawQ();
  const el=document.getElementById('fb'); if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function skip(){
  const q=P.list[P.i];
  if(!S.unknown.includes(q.qid)){S.unknown.push(q.qid);}
  (q.refs||[]).forEach(n=>S.weak[n]=(S.weak[n]||0)+2);
  S.answers[q.qid]={sel:0,ok:false,t:Date.now(),exam:q.exam,no:q.no,sub:q.subjectNo,unit:q.unit,skip:1};
  save(); P.shown[q.qid]=true; drawQ();
}
function saveMemo(qid){const v=document.getElementById('memo').value.trim();if(v)S.notes[qid]=v;else delete S.notes[qid];save();toast('메모를 저장했습니다')}
function mv(d){
  if(P.i+d>=P.list.length){return result()}
  P.i=Math.max(0,P.i+d); drawQ();
}
function result(){
  const done=P.list.filter(q=>S.answers[q.qid]);
  const ok=done.filter(q=>S.answers[q.qid].ok).length;
  const wrong=done.filter(q=>!S.answers[q.qid].ok);

  app().innerHTML=`

    <div class="kpi"><div class="v">${done.length}</div><div class="k">푼 문제</div></div>

    <div class="kpi"><div class="v" style="color:${ok/done.length>=.6?'var(--ok)':'var(--no)'}">${done.length?Math.round(ok/done.length*100):0}%</div><div class="k">정답률</div></div>
  </div>
  ${Object.keys(byUnit).length?`<h2 class="sec">틀린 단원</h2>
    ${Object.entries(byUnit).sort((a,b)=>b[1]-a[1]).map(([u,c])=>
      `<button class="lrow" onclick="go('#/play?mode=unit&unit=${encodeURIComponent(u)}')"><span class="chip no">${c}</span>
       <span class="g"><span class="t">${esc(u)}</span><span class="s">이 단원 문제 더 풀기</span></span><span class="muted">›</span></button>`).join('')}`:''}
  ${wrong.length?`<h2 class="sec">틀린 문제 (${wrong.length})</h2>
    ${wrong.map(q=>`<div class="card tight"><div class="tiny muted">${esc(q.exam)} ${q.no}번 · ${esc(q.unit)}</div>
      <div class="small" style="margin:4px 0">${esc((q.stem.find(b=>b.type==='text')||{}).text||'').slice(0,90)}…</div>
      <div class="tiny"><span class="chip no">내 답 ${S.answers[q.qid].sel?CIRC[S.answers[q.qid].sel-1]:'—'}</span>
      <span class="chip ok">정답 ${CIRC[q.answer-1]}</span>
      ${(q.refs||[]).slice(0,2).map(n=>`<a class="chip" href="#/sec?no=${n}">${esc(secTitle(n))}</a>`).join(' ')}</div></div>`).join('')}`:''}
  <div class="grid2" style="margin-top:14px">
    <button class="btn" onclick="go('#/analysis')">오답 분석 보기</button>
    <button class="btn pri" onclick="go('#/gen')">약점 문제 생성</button>
  </div><div style="height:24px"></div>`;
}

/* ══════════════════════════════════════════════════════════
   10-b. 오답 학습노트 (AI 생성)  ★ 3번 영역 ★
   오답 분석 데이터(취약 개념 · 내 오답 이력)를 프롬프트로 뽑아
   AI(Claude·ChatGPT)가 "내가 모르는 개념"을 정리한 학습 데이터를
   만들어 주면, 그 JSON을 불러와 S.studyNotes에 모아 저장한다.
   (정적 사이트라 API 키를 넣을 수 없어 복사–붙여넣기 왕복으로 처리)
     · copyNotePrompt(min)  취약 개념+오답 이력 프롬프트를 클립보드로
     · importNotes()        AI가 만든 JSON '파일'을 업로드해 노트로 저장
     · applyNotes(arr)      파싱된 배열을 studyNotes에 반영(복습·정리 보존)
     · relWrongs(no)        각 개념에 내 실제 오답 문항을 붙임
     · vNotes()             저장된 노트를 보고 복습 체크·직접 정리·내보내기
   S.studyNotes[key] = {no,sec,title,unit,subjectNo,score,source,
                        summary,keyPoints,confuse,mnemonic,
                        wrongs,note,reviewed,createdAt,updatedAt}
   ══════════════════════════════════════════════════════════ */
// 이 개념(secNo)과 얽혀 틀린 문제들을 모은다.
//  misread = 내가 이 개념이라고 착각해 고른 오답 / missed = 정답이 이 개념인데 놓침 / topic = 문항 주제
function relWrongs(secNo){
  const out=[];
  Object.entries(S.answers).forEach(([qid,a])=>{
    if(a.ok)return;
    const q=D.qById[qid]; if(!q)return;
    const sel=a.sel;
    const selRefs=sel&&q.options[sel-1]?(q.options[sel-1].refs||[]):[];
    const ansRefs=q.options[q.answer-1]?(q.options[q.answer-1].refs||[]):[];
    const asMisread=selRefs.indexOf(secNo)>=0;
    const asMissed=!isNeg(q)&&ansRefs.indexOf(secNo)>=0;
    const asTopic=(q.refs||[]).slice(0,1).indexOf(secNo)>=0;
    if(asMisread||asMissed||asTopic)
      out.push({qid,sel,answer:q.answer,
        myText:sel&&q.options[sel-1]?q.options[sel-1].text:'모르겠음',
        ansText:q.options[q.answer-1]?q.options[q.answer-1].text:'',
        kind:asMisread?'misread':(asMissed?'missed':'topic')});
  });
  return out;
}
// 취약 개념 + 최근 오답 + 메모를 담아 AI에게 줄 프롬프트를 만든다.
function notePrompt(min){
  const w=weakList(min).slice(0,15);
  if(!w.length)return '';
  const concepts=w.map(x=>`- sec=${x.no} | ${x.sec.subjectNo}과목 / ${x.sec.unit} / ${x.sec.title} (${x.v}점)`).join('\n');
  const wrongs=Object.entries(S.answers).filter(([,a])=>!a.ok).slice(-25).map(([id,a])=>{
    const q=D.qById[id];
    if(!q)return `- ${id}`;
    const my=a.sel&&q.options[a.sel-1]?`${CIRC[a.sel-1]}"${q.options[a.sel-1].text.slice(0,32)}"`:'모르겠음';
    const ans=q.options[q.answer-1]?`${CIRC[q.answer-1]}"${q.options[q.answer-1].text.slice(0,32)}"`:'';
    return `- ${id}: 나 ${my} → 정답 ${ans}`;
  }).join('\n')||'- (없음)';
  const memos=Object.entries(S.notes).slice(-10).map(([id,t])=>`- ${id}: ${t}`).join('\n')||'- (없음)';
  return `너는 정보처리산업기사 필기 학습 코치다. 아래 학습자의 오답 분석 데이터를 바탕으로, 학습자가 "모르는 개념"을 스스로 이해하도록 정리한 학습노트를 만들어라.

[취약 개념  (sec = 개념 번호, 그대로 되돌려줄 것 / 점수 높을수록 취약)]
${concepts}

[최근 틀린 문제  (내가 고른 답 → 정답)]
${wrongs}

[내가 남긴 메모]
${memos}

[요구사항]
1. 위 취약 개념(sec)마다 학습노트 1개를 만든다.
2. 각 노트는 다음 필드를 채운다.
   - summary  : 개념을 쉬운 말로 3~5문장
   - keyPoints: 시험에 자주 나오는 핵심 3~5개(배열)
   - confuse  : 이 학습자가 무엇과 혼동하는지·왜 틀리는지(위 오답을 근거로)
   - mnemonic : 외우는 팁 한 줄
3. sec는 위에서 준 숫자를 그대로 되돌려준다.
4. 결과를 아래 형식의 JSON 배열로 만들고, "study-notes.json" 이라는 이름의
   내려받을 수 있는 파일로 출력한다. (설명 문장 없이 JSON 배열만 파일에 담을 것)

[{"sec":${w[0].no},"title":"${esc(w[0].sec.title)}","summary":"...","keyPoints":["...","..."],"confuse":"...","mnemonic":"..."}]`;
}
// 프롬프트 복사 — 오답 문항 텍스트가 필요하므로 회차 데이터를 먼저 받아둔다.
async function copyNotePrompt(){
  const wrongIds=Object.entries(S.answers).filter(([,a])=>!a.ok).map(([id])=>id);
  await Promise.all([...new Set(wrongIds.map(i=>i.slice(0,6)))].map(getExam));
  const p=notePrompt(NF.min);
  if(!p){toast('취약 개념 기록이 없습니다');return}
  navigator.clipboard.writeText(p).then(()=>toast('학습노트 프롬프트를 복사했습니다')).catch(()=>{
    const t=document.createElement('textarea');t.value=p;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('학습노트 프롬프트를 복사했습니다')});
}
// 파싱된 노트 배열을 S.studyNotes에 저장. 복습 상태·직접 쓴 정리는 보존한다.
function applyNotes(arr){
  let n=0;
  arr.forEach((x,i)=>{
    if(!x||typeof x!=='object')return;
    const sec=+x.sec||0;
    const meta=sec&&D.sec[sec]?D.sec[sec]:null;
    const key=sec?String(sec):'ai'+Date.now()+i;
    const prev=S.studyNotes[key];
    S.studyNotes[key]={
      createdAt:prev?prev.createdAt:Date.now(),
      reviewed:prev?prev.reviewed:false,
      note:prev?prev.note:(sec?(S.secNotes[sec]||''):''),
      no:key, sec:sec||null, source:'ai',
      title:x.title||(meta?meta.title:'AI 학습노트'),
      unit:meta?meta.unit:(x.unit||''),
      subjectNo:meta?meta.subjectNo:(x.subjectNo||''),
      score:sec?(S.weak[sec]||0):0,
      summary:x.summary||'',
      keyPoints:Array.isArray(x.keyPoints)?x.keyPoints.map(String):[],
      confuse:x.confuse||'', mnemonic:x.mnemonic||'',
      wrongs:sec?relWrongs(sec):[],
      updatedAt:Date.now()
    };
    n++;
  });
  return n;
}
// AI가 만든 학습노트 JSON '파일'을 업로드해 불러온다.
// (AI에게 .json 파일로 내려받게 한 뒤 그 파일을 그대로 올리면 됨)
function importNotes(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let data; try{data=JSON.parse(r.result)}catch(x){alert('JSON 파일을 읽을 수 없습니다: '+x.message);return}
      // 배열이거나, {notes:[...]}/{studyNotes:[...]} 형태 모두 허용
      const arr=Array.isArray(data)?data
        :(data&&Array.isArray(data.notes)?data.notes
        :(data&&Array.isArray(data.studyNotes)?data.studyNotes:null));
      if(!arr){alert('학습노트 JSON 배열을 찾을 수 없습니다. [{...}] 형식의 .json 파일인지 확인하세요');return}
      const n=applyNotes(arr);
      if(!n){alert('불러올 노트가 없습니다');return}
      save(); toast(`${n}개 AI 학습노트를 저장했습니다`); vNotes();
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ── 학습노트 기반 '반드시 암기 + 확인 테스트' (AI 생성) ──
   저장된 학습노트를 재료로 AI가 개념별 필수 암기 항목(mustMemorize)과
   4지선다 확인 문제(quiz)를 만들어 주면, 각 노트에 붙여 저장한다.
   테스트는 기존 자동생성 문제 플레이어(drawGen)를 그대로 재사용한다. */
// 저장된 노트를 담아 AI에게 줄 '암기·테스트' 프롬프트를 만든다.
function reviewPrompt(){
  const notes=Object.values(S.studyNotes).filter(n=>n.sec).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,15);
  if(!notes.length)return '';
  const body=notes.map(n=>{
    const kp=(n.keyPoints&&n.keyPoints.length)?n.keyPoints.join(' / '):'';
    return `### sec=${n.sec} | ${esc(n.title)} (${n.subjectNo}과목/${esc(n.unit||'')})
- 개념: ${(n.summary||'').replace(/\n/g,' ')}
- 핵심: ${kp}
- 혼동: ${(n.confuse||'').replace(/\n/g,' ')}`;
  }).join('\n\n');
  return `너는 정보처리산업기사 필기 학습 코치다. 아래는 학습자가 정리한 개념별 학습노트다. 각 개념(sec)마다 두 가지를 만들어라.

[학습노트]
${body}

[요구사항]
1. mustMemorize : 시험 전 반드시 외워야 할 필수 암기 항목 3~6개(각 항목은 짧게 한 줄). 정의·공식·키워드·비교 포인트 위주.
2. quiz : 제대로 학습됐는지 확인하는 4지선다 문제 2~3개. 각 문제는 {q(지문), options(보기 4개), answer(정답 번호 1~4), why(정답 해설)}.
   - 위 '혼동' 포인트를 노린 매력적인 오답을 반드시 섞을 것.
3. sec는 위에서 준 숫자를 그대로 되돌려준다.
4. 결과를 아래 형식의 JSON 배열로 만들고 "review-pack.json" 이라는 이름의 내려받을 수 있는 파일로 출력한다. (설명 문장 없이 JSON 배열만)

[{"sec":${notes[0].sec},"mustMemorize":["...","..."],"quiz":[{"q":"...","options":["①","②","③","④"],"answer":2,"why":"..."}]}]`;
}
function copyReviewPrompt(){
  const p=reviewPrompt();
  if(!p){toast('먼저 학습노트를 만들어 주세요');return}
  navigator.clipboard.writeText(p).then(()=>toast('암기·테스트 프롬프트를 복사했습니다')).catch(()=>{
    const t=document.createElement('textarea');t.value=p;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('암기·테스트 프롬프트를 복사했습니다')});
}
// quiz 항목 검증 — q/options(2개 이상)/answer(범위 내)가 갖춰진 것만 통과
function validQuiz(arr){
  if(!Array.isArray(arr))return [];
  return arr.filter(z=>z&&typeof z.q==='string'&&Array.isArray(z.options)&&z.options.length>=2
      &&+z.answer>=1&&+z.answer<=z.options.length)
    .map(z=>({q:z.q,options:z.options.map(o=>String(o).replace(/^[①②③④]\s*/,'')),answer:+z.answer,why:z.why||''}));
}
// AI가 만든 암기·테스트 JSON 파일을 업로드해 각 학습노트에 붙인다.
function importReview(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let data; try{data=JSON.parse(r.result)}catch(x){alert('JSON 파일을 읽을 수 없습니다: '+x.message);return}
      const arr=Array.isArray(data)?data:(data&&Array.isArray(data.review)?data.review:(data&&Array.isArray(data.items)?data.items:null));
      if(!arr){alert('암기·테스트 JSON 배열을 찾을 수 없습니다');return}
      let cnt=0;
      arr.forEach(x=>{
        if(!x||typeof x!=='object')return;
        const sec=+x.sec||0; if(!sec)return;
        const key=String(sec);
        let n=S.studyNotes[key];
        if(!n){ // 노트가 없으면 최소 노트를 만들어 담는다
          const meta=D.sec[sec];
          n=S.studyNotes[key]={createdAt:Date.now(),reviewed:false,note:S.secNotes[sec]||'',
            no:key,sec:sec,source:'ai',title:meta?meta.title:'AI 학습노트',
            unit:meta?meta.unit:'',subjectNo:meta?meta.subjectNo:'',score:S.weak[sec]||0,
            summary:'',keyPoints:[],confuse:'',mnemonic:'',wrongs:relWrongs(sec)};
        }
        n.mustMemorize=Array.isArray(x.mustMemorize)?x.mustMemorize.map(String):(n.mustMemorize||[]);
        n.quiz=validQuiz(x.quiz);
        n.updatedAt=Date.now();
        cnt++;
      });
      if(!cnt){alert('불러올 항목이 없습니다');return}
      save(); toast(`${cnt}개 개념에 암기·테스트를 추가했습니다`); vNotes();
    };
    r.readAsText(f);
  };
  inp.click();
}
// 한 개념의 확인 테스트를 기존 문제 플레이어로 실행
function startNoteQuiz(sec){
  const n=S.studyNotes[String(sec)];
  if(!n||!n.quiz||!n.quiz.length){toast('이 개념의 테스트 문제가 없습니다');return}
  G.items=n.quiz.map(z=>({type:'ai',sec:n.sec||+sec||0,q:z.q,options:z.options,answer:z.answer,why:z.why||''}));
  G.i=0;G.ans={};go('#/gen');
}
// 저장된 모든 노트의 테스트를 섞어서 실행
function startAllQuiz(){

let G={mode:'weak',n:10,items:null,i:0,ans:{}};
async function vGen(){

    <div class="card tight small muted">총 ${S.gen.length}세트 · 마지막 ${new Date(S.gen[S.gen.length-1].t).toLocaleString('ko-KR')}</div>`:''}

function pool(){
  let secs=D.summary.slice();
  if(G.mode.startsWith('s'))secs=secs.filter(s=>s.subjectNo===+G.mode[1]);
  else if(G.mode==='weak'){const w=new Set(weakList(2).map(x=>x.no));
    const ws=secs.filter(s=>w.has(s.no)); if(ws.length>=3)secs=ws;}
  return secs;
}
// 문제 재료로 쓸 만한 불릿만 (예제 풀이 과정·숫자 나열은 제외)
function bullets(s){
  return s.body.filter(b=>{
    if(b.type!=='text'||!b.bullet)return false;
    const t=b.text; if(t.length<8||t.length>90)return false;
    if(/^\d+\s*회전|^초기\s*상태|^예제|^\d+단계/.test(t))return false;
    const dig=(t.match(/[0-9]/g)||[]).length;
    return dig/t.length<=0.3;
  }).map(b=>b.text);
}
function makeGen(){
  const secs=pool(), out=[];
  const rich=shuffle(secs.filter(s=>bullets(s).length>=3));
  // 오답 보기는 되도록 "같은 단원"에서 뽑아 난이도를 맞춘다 (없으면 같은 과목)
  const others=s=>{
    const near=D.summary.filter(x=>x.no!==s.no&&x.unit===s.unit).flatMap(bullets);
    const far =D.summary.filter(x=>x.no!==s.no&&x.subjectNo===s.subjectNo&&x.unit!==s.unit).flatMap(bullets);
    return [...shuffle(near),...shuffle(far)].slice(0,12);
  };
  // A) "~에 해당하지 않는 것은?"
  for(const s of rich){
    if(out.length>=Math.ceil(G.n*0.5))break;
    const b=shuffle(bullets(s)).slice(0,3);
    // 정답 보기들과 머리말(: 앞)이 겹치는 오답은 모호해지므로 제외
    const head=t=>t.split(/[:：(]/)[0].trim().replace(/\s/g,'');
    const hs=new Set(b.map(head));
    const d=others(s).filter(x=>!b.includes(x)&&!hs.has(head(x)))[0];
    if(!d)continue;
    const opts=shuffle([...b.map(t=>({t,ok:0})),{t:d,ok:1}]);
    out.push({type:'notin',sec:s.no,q:`다음 중 「${s.title}」에 해당하지 않는 것은?`,
      options:opts.map(o=>o.t),answer:opts.findIndex(o=>o.ok)+1,
      why:`「${s.title}」의 내용이 아닙니다. 나머지 3개는 해당 항목의 내용입니다.`});
  }
  // B) 용어 → 설명 매칭
  const gl=shuffle(D.gloss.filter(g=>secs.some(s=>s.no===g.sec)&&g.desc.length>=12&&g.desc.length<=140));
  const near=g=>{
    const a=shuffle(D.gloss.filter(x=>x.unit===g.unit&&x.term!==g.term));
    const b=shuffle(D.gloss.filter(x=>x.subject===g.subject&&x.unit!==g.unit&&x.term!==g.term));
    return [...a,...b];
  };
  for(const g of gl){
    if(out.length>=G.n)break;
    const dis=near(g).slice(0,3);
    if(dis.length<3)continue;
    const opts=shuffle([{t:g.term,ok:1},...dis.map(x=>({t:x.term,ok:0}))]);
    out.push({type:'define',sec:g.sec,q:`다음 설명에 해당하는 것은?\n\n「${g.desc}」`,
      options:opts.map(o=>o.t),answer:opts.findIndex(o=>o.ok)+1,
      why:`${g.term} : ${g.desc}`});
  }
  // C) 설명 고르기 (역방향)
  for(const g of gl){
    if(out.length>=G.n)break;
    const dis=near(g).filter(x=>x.desc!==g.desc).slice(0,3);
    if(dis.length<3)continue;
    const opts=shuffle([{t:g.desc,ok:1},...dis.map(x=>({t:x.desc,ok:0}))]);
    out.push({type:'match',sec:g.sec,q:`「${g.term}」에 대한 설명으로 옳은 것은?`,
      options:opts.map(o=>o.t),answer:opts.findIndex(o=>o.ok)+1,why:`${g.term} : ${g.desc}`});
  }
  if(!out.length){toast('생성 재료가 부족합니다. 범위를 넓혀보세요');return}
  G.items=shuffle(out).slice(0,G.n); G.i=0; G.ans={};
  S.gen.push({t:Date.now(),n:G.items.length,mode:G.mode}); if(S.gen.length>30)S.gen.shift(); save();
  drawGen();
}

  const it=G.items[G.i], picked=G.ans[G.i];
  document.getElementById('hTitle').textContent='자동 생성 문제';
  app().innerHTML=`
  <div class="row" style="margin:12px 0 4px">
    <span class="tiny muted">${G.i+1} / ${G.items.length}</span>
    <div class="bar" style="flex:1"><i style="width:${(G.i+1)/G.items.length*100}%"></i></div>
    <button class="btn sm gh" onclick="G.items=null;go('#/gen')">나가기</button>
  </div>
  <div class="card">
    <div class="qhd"><span class="chip">자동생성</span><span class="chip">${esc(secTitle(it.sec))}</span></div>
    <div class="stem"><p style="white-space:pre-wrap">${esc(it.q)}</p></div>
    <div class="opts">${it.options.map((t,k)=>{
      let c='opt'; if(picked){ if(k+1===it.answer)c+=' right'; else if(k+1===picked)c+=' wrong'; }
      return `<button class="${c}" ${picked?'disabled':`onclick="genPick(${k+1})"`}><b>${CIRC[k]}</b><span>${esc(t)}</span></button>`}).join('')}</div>
    ${picked?`<div class="fb ${picked===it.answer?'ok':'no'}"><b>${picked===it.answer?'✔ 정답':'✘ 오답'}</b> — 정답 ${CIRC[it.answer-1]}번
      <div class="small" style="margin-top:6px">${esc(it.why)}</div>
      <div class="small" style="margin-top:6px">📖 <a href="#/sec?no=${it.sec}">${esc(secTitle(it.sec))}</a> 요약 보기</div></div>`:''}
  </div>
  <div style="height:70px"></div>
  <div class="sticky-bot"><div class="wrap row">
    <button class="btn" onclick="genMv(-1)" ${G.i?'':'disabled'}>‹ 이전</button><div style="flex:1"></div>
    <button class="btn ${picked?'pri':''}" onclick="genMv(1)">${G.i===G.items.length-1?'끝내기':'다음 ›'}</button>
  </div></div>`;
}
function genPick(k){
  const it=G.items[G.i]; G.ans[G.i]=k;
  if(k!==it.answer)S.weak[it.sec]=(S.weak[it.sec]||0)+2; else S.weak[it.sec]=Math.max(0,(S.weak[it.sec]||0)-1);
  save(); drawGen();
}
function genMv(d){
  if(G.i+d>=G.items.length){
    const ok=Object.entries(G.ans).filter(([i,k])=>+k===G.items[i].answer).length;
    const tot=Object.keys(G.ans).length;
    G.items=null;
    app().innerHTML=`<h2 class="sec">생성 문제 결과</h2>
      <div class="grid3"><div class="kpi"><div class="v">${tot}</div><div class="k">푼 문제</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${ok}</div><div class="k">정답</div></div>
      <div class="kpi"><div class="v">${tot?Math.round(ok/tot*100):0}%</div><div class="k">정답률</div></div></div>
      <div class="grid2" style="margin-top:14px"><button class="btn" onclick="go('#/gen')">다시 생성</button>
      <button class="btn pri" onclick="go('#/analysis')">오답 분석 보기</button></div>`;
    return;
  }
  G.i=Math.max(0,G.i+d); drawGen();
}
function copyPrompt(){
  const w=weakList(2).slice(0,12);
  const wrongIds=Object.entries(S.answers).filter(([,a])=>!a.ok).slice(-25).map(([id,a])=>({qid:id,내가고른답:a.sel||'모르겠음'}));
  const p=`너는 정보처리산업기사 필기 출제위원이다. 아래 학습자의 취약 개념을 바탕으로 4지선다 문제 15개를 만들어라.

[취약 개념 (점수 높을수록 취약)]
${w.map(x=>`- ${x.sec.subjectNo}과목 / ${x.sec.unit} / ${x.sec.title} (${x.v}점)`).join('\n')||'- (기록 없음)'}

[내가 남긴 메모]
${Object.entries(S.notes).slice(-10).map(([id,t])=>`- ${id}: ${t}`).join('\n')||'- (없음)'}

[최근 틀린 문제]
${JSON.stringify(wrongIds)}

[요구사항]
1. 실제 기출과 같은 난이도·문체(~것은?, ~옳지 않은 것은?)
2. 각 오답 선택지마다 "이걸 고른 사람은 무엇을 착각한 것인지"를 misread 필드에 적을 것
3. 아래 JSON 배열 형식으로만 출력 (설명 문장 없이)

[{"q":"문제 지문","code":"코드나 표가 있으면 여기(없으면 생략)","options":["①내용","②내용","③내용","④내용"],"answer":2,"why":"정답 해설","misread":["①을 고른 이유","②...","③...","④..."],"topic":"관련 개념명"}]`;
  navigator.clipboard.writeText(p).then(()=>toast('프롬프트를 복사했습니다')).catch(()=>{
    const t=document.createElement('textarea');t.value=p;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('프롬프트를 복사했습니다')});
}
function importGen(){
  const raw=prompt('AI가 만든 JSON 배열을 붙여넣으세요');
  if(!raw)return;
  try{
    const arr=JSON.parse(raw);
    G.items=arr.map(x=>({type:'ai',sec:0,q:x.q+(x.code?'\n\n'+x.code:''),options:x.options.map(o=>String(o).replace(/^[①②③④]\s*/,'')),
      answer:+x.answer,why:(x.why||'')+(x.misread?'\n\n오답 분석: '+x.misread.join(' / '):'')}));
    G.i=0;G.ans={};drawGen();
  }catch(e){alert('JSON 형식이 올바르지 않습니다: '+e.message)}
}

/* ══════════════════════════════════════════════════════════
   12. 설정 / 백업
   ══════════════════════════════════════════════════════════ */
function vSettings(){
  const st=stat();
  app().innerHTML=`
  <h2 class="sec">데이터</h2>
  <div class="card tight small muted">모든 기록은 이 브라우저에만 저장됩니다.
    기기를 옮기거나 초기화 전에 반드시 백업하세요.<br>
    푼 문제 ${st.n} · 메모 ${Object.keys(S.notes).length} · 취약 개념 ${weakList(1).length} · 학습노트 ${Object.keys(S.studyNotes).length} · 학습완료 ${Object.keys(S.secRead).length}</div>
  <div class="grid2">
    <button class="btn" onclick="expData()">백업 내보내기</button>
    <button class="btn" onclick="impData()">백업 불러오기</button>
  </div>
  <h2 class="sec">초기화</h2>
  <div class="grid2">
    <button class="btn" onclick="if(confirm('취약 개념 점수만 초기화할까요?')){S.weak={};save();toast('초기화했습니다')}">취약 점수 초기화</button>
    <button class="btn" style="color:var(--no)" onclick="if(confirm('모든 학습 기록을 지웁니다. 계속할까요?')){localStorage.removeItem(KEY);S=load();toast('전체 초기화');go('#/home')}">전체 초기화</button>
  </div>
  <h2 class="sec">문제은행</h2>
  <div class="card tight small muted">2022~2025년 12회차 720문항 · 핵심요약 193항목 · 용어 127개<br>
    문항 데이터는 <code>data/exam-YYYY-N.json</code>, 요약은 <code>data/summary.json</code>에 있습니다.</div>
  <div style="height:24px"></div>`;
}
function expData(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`정처산기_학습기록_${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function impData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];const r=new FileReader();
    r.onload=()=>{try{S=Object.assign({},DEF,JSON.parse(r.result));save();toast('불러왔습니다');go('#/home')}catch(x){alert('파일을 읽을 수 없습니다')}};
    r.readAsText(f)};
  i.click();
}
boot();
</script>
