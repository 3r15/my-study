<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정처산기">
<link rel="manifest" href="manifest.webmanifest">
<title>정보처리산업기사 필기 학습</title>
<style>
:root{
  --bg:#0f172a; --bg2:#111c33; --card:#16213c; --card2:#1c2b4a;
  --line:#26365a; --tx:#e6edf7; --tx2:#9fb0cc; --tx3:#6b7fa3;
  --ac:#5b9cff; --ok:#31c48d; --no:#f26d6d; --wn:#f0b429; --pu:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.6; padding-bottom:72px;
}
a{color:var(--ac);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:840px;margin:0 auto;padding:0 14px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;height:52px}
.hd h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
.hd .sp{flex:1}
.hd button{background:none;border:none;color:var(--tx2);font-size:13px;padding:6px 8px;border-radius:8px}
.hd button:hover{background:var(--card)}

/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(15,23,42,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:840px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--tx3);font-size:11px;font-weight:600}
nav a.on{color:var(--ac)}
nav a i{font-style:normal;font-size:19px;line-height:1}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.tight{padding:11px 12px}
h2.sec{font-size:13px;color:var(--tx2);margin:20px 0 8px;font-weight:700;letter-spacing:.4px}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--tx2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:10px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#06162f}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.gh{background:transparent}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.chip.s1{color:#7ab8ff;border-color:#2b4a7a}
.chip.s2{color:#8ee6b8;border-color:#245f45}
.chip.s3{color:#d6b0ff;border-color:#4b3676}
.chip.ok{color:var(--ok);border-color:#245f45}
.chip.no{color:var(--no);border-color:#6d2b2b}
.bar{height:6px;background:#1d2b48;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px}
input,textarea,select{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.hide{display:none!important}

/* question */
.qhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qno{font-weight:800;font-size:15px;color:var(--ac)}
.stem{font-size:15.5px;line-height:1.65;word-break:break-word}
.stem p{margin:0 0 8px}
pre.code{background:#0b1425;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:10px 0;
  overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;color:#cfe0f7;white-space:pre}
.note{background:#0d1830;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px;color:#d4e0f2;white-space:pre-wrap}
table.qt{border-collapse:collapse;margin:10px 0;font-size:13px;width:auto;max-width:100%;display:block;overflow-x:auto}
table.qt td,table.qt th{border:1px solid var(--line);padding:5px 10px;white-space:nowrap;text-align:center}
table.qt tr:first-child td{background:var(--card2);font-weight:700}
.qimg{max-width:100%;background:#fff;border-radius:8px;margin:10px 0;display:block;padding:6px}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:9px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:left;width:100%;color:var(--tx);font-size:14.5px;line-height:1.55}
.opt:hover{border-color:#3c5a92}
.opt b{color:var(--tx2);flex:none;font-weight:700}
.opt.sel{border-color:var(--ac);background:#16294a}
.opt.right{border-color:var(--ok);background:#102f22}
.opt.right b{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:#331616}
.opt.wrong b{color:var(--no)}
.opt .why{display:block;font-size:11.5px;color:var(--tx3);margin-top:3px}
.fb{margin-top:12px;border-radius:11px;padding:11px 13px;font-size:13.5px;border:1px solid var(--line);background:var(--card2)}
.fb.ok{border-color:#245f45;background:#10281f}
.fb.no{border-color:#6d2b2b;background:#2a1414}

/* list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:7px 0;width:100%;text-align:left;color:var(--tx)}
.lrow:hover{border-color:var(--ac)}
.lrow .g{flex:1;min-width:0}
.lrow .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.pill{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-ms-overflow-style:none;scrollbar-width:none}
.pill::-webkit-scrollbar{display:none}
.pill button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--tx2);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill button.on{background:var(--ac);border-color:var(--ac);color:#06162f}
.empty{text-align:center;color:var(--tx3);padding:40px 10px;font-size:13.5px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.kpi .k{font-size:11px;color:var(--tx3);margin-top:2px}
details.sm summary{cursor:pointer;font-size:12.5px;color:var(--tx2);padding:4px 0}
.sticky-bot{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:40;background:rgba(15,23,42,.97);border-top:1px solid var(--line);padding:9px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;background:#233a63;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
mark{background:#3c4f2a;color:#e9ffcf;border-radius:3px;padding:0 2px}

/* ══ 실기(prac) ══ */
.mtog{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.mtog button{border:none;background:none;color:var(--tx3);font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px}
.mtog button.on{background:var(--ac);color:#06162f}
pre.code{background:#0b1428;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:8px 0;
  overflow-x:auto;font:12.5px/1.62 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe0f7;white-space:pre;tab-size:4}
pre.code .kw{color:#7fb0ff;font-weight:600}
pre.code .ty{color:#67d5b5}
pre.code .st{color:#f0b429}
pre.code .nu{color:#e59adf}
pre.code .cm{color:#5c7099;font-style:italic}
pre.code .fn{color:#ffd9a0}
.ansbox{width:100%;background:#0b1428;border:1px solid var(--line);border-radius:11px;color:var(--tx);
  padding:10px 12px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;min-height:52px}
.ansbox:focus{outline:none;border-color:var(--ac)}
.outbox{background:#0b1428;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:6px 0;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#cfe0f7}
.outbox.ok{border-color:var(--ok)} .outbox.no{border-color:var(--no)}
.trwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:11px}
table.tr{border-collapse:collapse;width:100%;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
table.tr th{background:var(--card2);color:var(--tx2);font-weight:700;padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.tr td{padding:5px 9px;text-align:right;border-bottom:1px solid #1d2a45;color:var(--tx);white-space:nowrap}
table.tr tr:last-child td{border-bottom:none}
table.tr tr:nth-child(even) td{background:rgba(255,255,255,.017)}
table.tr td.i,table.tr th.i{text-align:center;color:var(--tx3);background:var(--bg2)}
.fmt{background:var(--bg2);border:1px dashed var(--line);border-radius:9px;padding:7px 11px;margin:0 0 7px;
  font-size:12.5px;line-height:1.6;color:var(--tx2)}
.fmt b{color:var(--ac)}
.diag{border-left:3px solid var(--wn);background:#2a2211;border-radius:0 10px 10px 0;padding:9px 12px;margin:8px 0;font-size:13px}
.diag b{color:var(--wn)}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--tx2);margin:0 5px 5px 0}
.fchip.on{background:var(--ac);border-color:var(--ac);color:#06162f}
.fchip small{opacity:.7;font-weight:700}
.frow{display:flex;flex-wrap:wrap;margin:4px 0 2px}
.mini{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;flex:1}
.mini i{display:block;height:100%;border-radius:4px}


.chip.ok2{color:var(--ok);border-color:#245c44;background:#0f2a1f}
.nrule{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #1d2a45;font-size:14px;line-height:1.62}
.nrule:last-child{border-bottom:none}
.nrule .nn{flex:none;width:19px;height:19px;border-radius:6px;background:var(--card2);color:var(--tx3);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.ntrap{border-left:3px solid var(--wn);background:#241f11;border-radius:0 11px 11px 0;padding:10px 13px;margin:8px 0}
.ntrap b{color:var(--wn);font-size:13.5px}
code.ic{background:#0b1428;border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#9fd0ff}
.lrow .g .s{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header><div class="wrap hd">
  <h1 id="hTitle">정보처리산업기사 필기</h1><div class="sp"></div>
  <div class="mtog" id="mTog"></div><button onclick="go('#/settings')">⚙</button>
</div></header>

<main id="app" class="wrap"><div class="empty">불러오는 중…</div></main>

<nav><div class="in" id="navIn"></div></nav>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   1. 저장소 (localStorage) — 학습 기록 · 취약점 · 메모
   ══════════════════════════════════════════════════════════ */
const KEY='jbsg_v2';
const DEF={answers:{},notes:{},secNotes:{},secRead:{},weak:{},gen:[],genAns:{},unknown:[],studyNotes:{},gaps:{},drillBank:[],drillMastered:{},drillWrong:{},sumPick:[],aiSummary:[],prac:{ans:{},notes:{},tag:{},read:{},mode:'input'},ver:2};
let S=load();
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return Object.assign({},DEF)}}
let _sv;function save(){clearTimeout(_sv);_sv=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(S)),120)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}

/* ══════════════════════════════════════════════════════════
   2. 데이터 로딩
   ══════════════════════════════════════════════════════════ */
const D={index:null,exams:{},summary:null,sec:{},gloss:null,qById:{},newc:null};
const j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' → HTTP '+r.status);return r.json()});
async function boot(){
  try{
    [D.index,D.summary]=await Promise.all([j('data/index.json'),j('data/summary.json')]);
  }catch(e){ return bootFail(e) }
  D.summary.forEach(s=>D.sec[s.no]=s);
  window.addEventListener('hashchange',route); route();
  if('serviceWorker' in navigator&&location.protocol!=='file:')
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  // 첫 화면을 그린 뒤 남는 시간에 회차 데이터를 미리 받아둔다
  // (랜덤·취약 개념 모드가 12개 파일을 필요로 하므로)
  const idle=window.requestIdleCallback||(f=>setTimeout(f,800));
  idle(()=>{ D.index.exams.forEach((e,i)=>setTimeout(()=>getExam(e.id).catch(()=>{}),i*120)) });
}
// 용어사전은 해당 탭에 들어갈 때만 (초기 로딩 21KB 절약)
async function needGloss(){ if(!D.gloss) D.gloss=await j('data/glossary.json'); return D.gloss }
async function needNewc(){ if(!D.newc) D.newc=await j('data/new-concepts.json'); return D.newc }
function bootFail(e){
  const local=location.protocol==='file:';
  document.getElementById('app').innerHTML=`
  <div class="card" style="margin-top:24px;border-color:#6d2b2b">
    <h3 style="margin:0 0 8px;font-size:16px;color:var(--no)">데이터를 불러오지 못했습니다</h3>
    ${local?`<p class="small">브라우저가 <code>file://</code>로 열린 파일에서는 보안 정책(CORS)상 데이터 파일을 읽지 못합니다.
      <b>index.html을 더블클릭해서 여는 방식으로는 동작하지 않습니다.</b></p>
      <p class="small" style="margin-top:10px">study-site 폴더에서 아래 명령을 실행하고
      <a href="http://localhost:8000">http://localhost:8000</a> 으로 접속하세요.</p>
      <pre class="code">python -m http.server 8000</pre>
      <p class="small muted">또는 GitHub Pages에 올리면 바로 됩니다 (README 참고).</p>`
    :`<p class="small">${esc(e.message)}</p>
      <p class="small muted">data/ 폴더가 index.html과 같은 위치에 있는지 확인해 주세요.</p>`}
  </div>`;
}
async function getExam(id){
  if(D.exams[id])return D.exams[id];
  const e=await j(`data/exam-${id}.json`);
  e.questions.forEach(q=>{q.exam=id;q.qid=`${id}-${String(q.no).padStart(2,'0')}`;D.qById[q.qid]=q;});
  D.exams[id]=e; return e;
}
async function allQuestions(){
  await Promise.all(D.index.exams.map(e=>getExam(e.id)));
  return D.index.exams.flatMap(e=>D.exams[e.id].questions);
}

/* ══════════════════════════════════════════════════════════
   3. 렌더 유틸
   ══════════════════════════════════════════════════════════ */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CIRC=['①','②','③','④'];
function block(b){
  if(b.type==='text')  return `<p>${esc(b.text)}</p>`;
  if(b.type==='code')  return `<pre class="code">${esc(dedent(b))}</pre>`;
  if(b.type==='note')  return `<div class="note">${esc(b.lines.join('\n'))}</div>`;
  if(b.type==='image') return `<img class="qimg" src="img/${esc(b.src)}" loading="lazy" style="max-width:${Math.min(100,Math.round(b.w*1.55))}%">`;
  if(b.type==='table'){
    return `<table class="qt"><tbody>${b.grid.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return '';
}
function dedent(b){
  const ind=b.indents||[];const m=ind.length?Math.min(...ind):0;
  return b.lines.map((l,i)=>' '.repeat(Math.max(0,Math.round(((ind[i]||m)-m)/5.3)*2))+l).join('\n');
}
const stemHtml=q=>q.stem.map(block).join('');
const subjChip=n=>`<span class="chip s${n}">${n}과목</span>`;
const secTitle=n=>D.sec[n]?D.sec[n].title:('#'+n);

/* ══════════════════════════════════════════════════════════
   4. 채점 + 취약점 기록  ★ 3번 영역의 핵심 ★
   각 선택지에 미리 계산된 refs(핵심요약 섹션 번호)가 붙어 있어서
   "내가 고른 오답이 어떤 개념인지"를 그대로 취약점으로 기록한다.
   ══════════════════════════════════════════════════════════ */
// 부정형 문항("~이 아닌 것은?")은 정답 선택지가 오히려 '틀린 설명'이라
// 정답 선택지의 개념을 취약점으로 잡으면 노이즈가 된다.
const NEG=/아닌|않는|않은|틀린|잘못|거리가 먼/;
function isNeg(q){return NEG.test(q.stem.filter(b=>b.type==='text').map(b=>b.text).join(' '))}
function grade(q,sel){
  const ok=(sel===q.answer);
  S.answers[q.qid]={sel,ok,t:Date.now(),exam:q.exam,no:q.no,sub:q.subjectNo,unit:q.unit};
  const bump=(n,w)=>{if(!n)return;S.weak[n]=Math.max(0,(S.weak[n]||0)+w)};
  if(!ok){
    // ① 내가 고른 오답의 개념 → 이걸 "옳다"고 착각했다
    (q.options[sel-1].refs||[]).forEach(n=>bump(n,3));
    // ② 정답 선택지의 개념 → 이걸 몰랐다 (부정형 문항은 제외)
    if(!isNeg(q))(q.options[q.answer-1].refs||[]).forEach(n=>bump(n,2));
    // ③ 문제 전체 주제
    (q.refs||[]).slice(0,1).forEach(n=>bump(n,2));
  }else{
    (q.refs||[]).forEach(n=>bump(n,-1));
  }
  save(); return ok;
}
// "왜 틀렸나요?" — 단순 실수는 취약 점수에서 되돌린다
function whyWrong(qid,kind){
  const q=D.qById[qid]; if(!q)return;
  const a=S.answers[qid]; if(!a)return;
  a.why=kind;
  if(kind==='mistake'){ // 개념은 아는데 실수 → 오답 가중치 되돌리기
    const undo=(n,w)=>{if(n)S.weak[n]=Math.max(0,(S.weak[n]||0)-w)};
    (q.options[a.sel-1]&&q.options[a.sel-1].refs||[]).forEach(n=>undo(n,3));
    if(!isNeg(q))(q.options[q.answer-1].refs||[]).forEach(n=>undo(n,2));
    (q.refs||[]).slice(0,1).forEach(n=>undo(n,2));
  }else if(kind==='concept'){ // 아예 몰랐음 → 주제에 더 무겁게
    (q.refs||[]).slice(0,2).forEach(n=>S.weak[n]=(S.weak[n]||0)+2);
  }
  save();
  const el=document.getElementById('whyBox');
  if(el)el.innerHTML=`<span class="tiny" style="color:var(--ok)">✔ ${({concept:'개념을 몰랐음',confuse:'헷갈렸음',mistake:'단순 실수 — 취약 점수에서 제외'})[kind]}으로 기록했습니다</span>`;
}
function stat(){
  const a=Object.values(S.answers);
  return {n:a.length,ok:a.filter(x=>x.ok).length,rate:a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0};
}
function weakList(min=1){
  return Object.entries(S.weak).map(([n,v])=>({no:+n,v,sec:D.sec[+n]}))
    .filter(x=>x.v>=min&&x.sec).sort((a,b)=>b.v-a.v);
}
function unitStats(){
  const m={};
  Object.values(S.answers).forEach(a=>{const u=a.unit||'기타';(m[u]=m[u]||{n:0,ok:0,sub:a.sub}).n++;if(a.ok)m[u].ok++});
  return Object.entries(m).map(([u,v])=>({unit:u,...v,rate:Math.round(v.ok/v.n*100)})).sort((a,b)=>a.rate-b.rate);
}

let P=null;
async function vPlay(a){
  app().innerHTML='<div class="empty">문제를 준비하는 중…</div>';
  let list=[],title='';
  if(a.mode==='exam'){const e=await getExam(a.id);list=e.questions.slice();title=e.title+' 기출';}
  else{
    const all=await allQuestions();
    if(a.mode==='random'){list=shuffle(all).slice(0,+a.n||20);title='랜덤 '+list.length+'문항';}
    else if(a.mode==='subject'){list=shuffle(all.filter(q=>q.subjectNo==a.sub)).slice(0,+a.n||30);title=a.sub+'과목 랜덤';}
    else if(a.mode==='unit'){const u=decodeURIComponent(a.unit);list=shuffle(all.filter(q=>q.unit===u));title=u;}
    else if(a.mode==='wrong'){list=all.filter(q=>S.answers[q.qid]&&!S.answers[q.qid].ok);title='틀린 문제 '+list.length+'개';}
    else if(a.mode==='sec'){const n=+a.no;list=all.filter(q=>(q.refs||[]).includes(n));title=secTitle(n)+' 관련';}
    else if(a.mode==='weak'){
      const w=weakList(2).slice(0,12).map(x=>x.no);
      const set=new Set(w);
      let c=all.filter(q=>(q.refs||[]).some(n=>set.has(n)));
      c.sort((x,y)=>{const s=q=>(S.answers[q.qid]?(S.answers[q.qid].ok?2:0):1);return s(x)-s(y)});
      list=c.slice(0,+a.n||20); title='취약 개념 집중';
      if(!list.length){list=shuffle(all).slice(0,20);title='랜덤 20문항 (기록 부족)';}
    }
  }
  if(!list.length){app().innerHTML=`<div class="empty">해당하는 문제가 없습니다.<br><br><button class="btn" onclick="history.back()">돌아가기</button></div>`;return}
  P={list,i:0,title,shown:{}};
  const first=list.findIndex(q=>!S.answers[q.qid]);
  P.i=(a.mode==='exam'&&first>0)?first:0;
  drawQ();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawQ(){
  const q=P.list[P.i], rec=S.answers[q.qid], shown=P.shown[q.qid]||!!rec;
  const sel=shown?(rec?rec.sel:null):null;
  document.getElementById('hTitle').textContent=P.title;
  app().innerHTML=`
  <div class="row" style="margin:12px 0 4px">
    <span class="tiny muted">${P.i+1} / ${P.list.length}</span>
    <div class="bar" style="flex:1"><i style="width:${(P.i+1)/P.list.length*100}%"></i></div>
    <button class="btn sm gh" onclick="go('#/exams')">나가기</button>
  </div>
  <div class="card">
    <div class="qhd">${subjChip(q.subjectNo)}<span class="qno">${q.no}.</span>
      <span class="chip">${esc(q.exam)}</span><span class="chip">${esc(q.unit||'')}</span>
      <div style="flex:1"></div>
      <button class="btn sm ${(S.sumPick||[]).includes(q.qid)?'pri':'gh'}" onclick="pickSum('${q.qid}')" title="핵심요약으로 만들 문제 선택">${(S.sumPick||[]).includes(q.qid)?'★ 요약선택':'☆ 요약'}</button></div>
    <div class="stem">${stemHtml(q)}</div>
    ${q.optionsImage?`<img class="qimg" src="img/${esc(q.optionsImage)}" loading="lazy">
       <div class="tiny muted" style="margin-bottom:6px">※ 선택지가 그림/표입니다. 위 이미지를 보고 번호를 고르세요.</div>`:''}
    <div class="opts" id="opts">${q.options.map((o,k)=>optHtml(q,o,k+1,sel,shown)).join('')}</div>
    <div id="fb">${shown?fbHtml(q,sel):''}</div>
  </div>
  <div style="height:70px"></div>
  <div class="sticky-bot"><div class="wrap row">
    <button class="btn" onclick="mv(-1)" ${P.i?'':'disabled'}>‹ 이전</button>
    <button class="btn gh sm" onclick="skip()">모르겠음</button>
    <div class="sp" style="flex:1"></div>
    <button class="btn ${shown?'pri':''}" onclick="mv(1)">${P.i===P.list.length-1?'결과 보기':'다음 ›'}</button>
  </div></div>`;
}
function optHtml(q,o,k,sel,shown){
  let cls='opt';
  if(shown){ if(k===q.answer)cls+=' right'; else if(k===sel)cls+=' wrong'; }
  else if(k===sel)cls+=' sel';
  const why=(shown&&k!==q.answer&&k===sel&&(o.refs||[]).length)
    ? `<span class="why">↳ 이 선택지는 「${esc(secTitle(o.refs[0]))}」 개념입니다</span>`:'';
  return `<button class="${cls}" ${shown?'disabled':`onclick="pick(${k})"`}>
    <b>${CIRC[k-1]}</b><span>${esc(o.text)||'<span class="muted">(위 그림 참조)</span>'}${why}</span></button>`;
}
function fbHtml(q,sel){
  const rec=S.answers[q.qid], ok=rec?rec.ok:(sel===q.answer);
  const refs=(q.refs||[]).slice(0,3);
  const miss=!ok&&rec&&rec.sel?(q.options[rec.sel-1].refs||[]):[];
  return `<div class="fb ${ok?'ok':'no'}">
    <b>${ok?'✔ 정답':'✘ 오답'}</b> — 정답은 ${CIRC[q.answer-1]}번입니다.
    ${!ok&&miss.length?`<div class="small" style="margin-top:6px">고른 선택지 개념: <b>${miss.map(n=>esc(secTitle(n))).join(', ')}</b> → 취약 개념으로 기록했습니다.</div>`:''}
    ${!ok?`<div id="whyBox" style="margin-top:9px">
      <div class="tiny muted" style="margin-bottom:5px">왜 틀렸나요?</div>
      <div class="row" style="gap:6px">
        <button class="btn sm" onclick="whyWrong('${q.qid}','concept')">개념을 몰랐다</button>
        <button class="btn sm" onclick="whyWrong('${q.qid}','confuse')">헷갈렸다</button>
        <button class="btn sm" onclick="whyWrong('${q.qid}','mistake')">단순 실수</button>
      </div>
      <div class="tiny muted" style="margin:9px 0 4px">내가 무엇을 모르는지 (학습노트·문제 생성에 반영됩니다)</div>
      <textarea id="gap_${q.qid}" style="min-height:52px" placeholder="예: 부분 함수 종속과 이행적 종속의 차이를 모르겠다">${esc(S.gaps[q.qid]||'')}</textarea>
      <button class="btn sm" style="margin-top:6px" onclick="saveGap('${q.qid}')">저장</button>
    </div>`:''}
    ${refs.length?`<div class="small" style="margin-top:7px">📖 관련 요약: ${refs.map(n=>`<a href="#/sec?no=${n}">${esc(secTitle(n))}</a>`).join(' · ')}</div>`:''}
    <details class="sm" style="margin-top:8px"><summary>✎ 모르는 내용 메모하기</summary>
      <textarea id="memo" placeholder="왜 틀렸는지, 뭘 몰랐는지 적어두면 오답분석에 모입니다">${esc(S.notes[q.qid]||'')}</textarea>
      <button class="btn sm" style="margin-top:6px" onclick="saveMemo('${q.qid}')">메모 저장</button>
    </details></div>`;
}
function pick(k){
  const q=P.list[P.i]; grade(q,k); P.shown[q.qid]=true; drawQ();
  const el=document.getElementById('fb'); if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function skip(){
  const q=P.list[P.i];
  if(!S.unknown.includes(q.qid)){S.unknown.push(q.qid);}
  (q.refs||[]).forEach(n=>S.weak[n]=(S.weak[n]||0)+2);
  S.answers[q.qid]={sel:0,ok:false,t:Date.now(),exam:q.exam,no:q.no,sub:q.subjectNo,unit:q.unit,skip:1};
  save(); P.shown[q.qid]=true; drawQ();
}
// 이 문제를 '핵심요약 생성' 대상으로 선택/해제
function pickSum(qid){

  else{S.sumPick.push(qid);toast('핵심요약 목록에 추가했습니다 (요약 페이지에서 생성)')}

}
function saveMemo(qid){const v=document.getElementById('memo').value.trim();if(v)S.notes[qid]=v;else delete S.notes[qid];save();toast('메모를 저장했습니다')}
function saveGap(qid){const el=document.getElementById('gap_'+qid);if(!el)return;const v=el.value.trim();if(v)S.gaps[qid]=v;else delete S.gaps[qid];save();toast('저장했습니다 — 학습노트·문제 생성에 반영됩니다')}
// 최근 '내가 모르는 것' 입력을 프롬프트용 문자열로
function gapsText(limit){

    ${wrong.map(q=>`<div class="card tight"><div class="tiny muted">${esc(q.exam)} ${q.no}번 · ${esc(q.unit)}</div>
      <div class="small" style="margin:4px 0">${esc((q.stem.find(b=>b.type==='text')||{}).text||'').slice(0,90)}…</div>
      <div class="tiny"><span class="chip no">내 답 ${S.answers[q.qid].sel?CIRC[S.answers[q.qid].sel-1]:'—'}</span>

async function copySumPrompt(){
  const picks=S.sumPick||[];
  if(!picks.length){toast('먼저 기출에서 문제를 골라 주세요');return}
  await Promise.all([...new Set(picks.map(i=>i.slice(0,6)))].map(getExam));
  const clean=t=>String(t==null?'':t).replace(/\s+/g,' ').trim();
  const body=picks.map(id=>{
    const q=D.qById[id]; if(!q)return `- ${id}`;
    const stem=(q.stem||[]).filter(b=>b.type==='text').map(b=>clean(b.text)).join(' ')||'(지문 생략)';
    const opts=(q.options||[]).map((o,i)=>`${CIRC[i]}${clean(o.text)}`).join(' ');
    const rel=(q.refs||[]).slice(0,2).map(n=>secTitle(n)).join(', ');
    return `- [${id}] ${stem}\n  보기: ${opts}\n  정답: ${CIRC[q.answer-1]}${rel?`\n  관련개념: ${rel}`:''}`;
  }).join('\n');
  const p=`너는 정보처리산업기사 필기 핵심요약 정리자다. 아래 기출문제들이 다루는 개념을 시험 대비용 '핵심요약'으로 정리하라.

[기출문제]
${body}

[요구사항]
1. 문제들이 다루는 핵심 개념을 주제별로 묶어 요약한다. (문제 자체가 아니라 그 문제가 묻는 '개념'을 정리)
2. 각 요약 항목의 필드:
   - title    : 개념/주제 이름
   - subjectNo: 1~3 과목 번호 (모르면 생략)
   - unit     : 단원명 (모르면 생략)
   - bullets  : 시험에 필요한 핵심 내용 배열 (정의·특징·비교·분류 등, 간결하게)
3. 간결하고 정확하게. 문제 지문을 그대로 베끼지 말 것.
4. 아래 형식의 JSON 배열만 "summary.json" 파일로 출력한다(설명 문장 없이).

[{"title":"...","subjectNo":3,"unit":"...","bullets":["...","..."]}]`;
  navigator.clipboard.writeText(p).then(()=>toast('핵심요약 프롬프트를 복사했습니다')).catch(()=>{
    const t=document.createElement('textarea');t.value=p;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('핵심요약 프롬프트를 복사했습니다')});
}
function importAiSummary(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{
      let data;try{data=JSON.parse(r.result)}catch(x){alert('JSON 파일을 읽을 수 없습니다: '+x.message);return}
      const arr=Array.isArray(data)?data:(data&&Array.isArray(data.summary)?data.summary:(data&&Array.isArray(data.items)?data.items:null));
      if(!arr){alert('요약 JSON 배열을 찾을 수 없습니다');return}
      const src=(S.sumPick||[]).slice();
      let n=0;
      arr.forEach(x=>{
        if(!x||typeof x!=='object')return;
        const title=String(x.title||'').trim();
        const bullets=(Array.isArray(x.bullets)?x.bullets:Array.isArray(x.body)?x.body:[]).map(v=>String(v).trim()).filter(Boolean);
        if(!title&&!bullets.length)return;
        S.aiSummary.push({id:'as'+Date.now()+n, title:title||'핵심요약', subjectNo:+x.subjectNo||0, unit:String(x.unit||'').trim(), bullets, source:src, createdAt:Date.now()});
        n++;
      });
      if(!n){alert('불러올 요약이 없습니다');return}
      save(); toast(`${n}개 AI 요약을 저장했습니다`); SF.view='ai'; vSummary();
    };
    r.readAsText(f);
  };
  inp.click();
}

  <h2 class="sec">취약 개념 랭킹 (${w.length})</h2>

      <button class="btn sm gh" style="margin-top:6px" onclick="jumpQ('${id}')">문제 보기</button></div>`).join('')}`:''}

/* ══════════════════════════════════════════════════════════
   10-b. 오답 학습노트 (AI 생성)  ★ 3번 영역 ★
   오답 분석 데이터(취약 개념 · 내 오답 이력)를 프롬프트로 뽑아
   AI(Claude·ChatGPT)가 "내가 모르는 개념"을 정리한 학습 데이터를
   만들어 주면, 그 JSON을 불러와 S.studyNotes에 모아 저장한다.
   (정적 사이트라 API 키를 넣을 수 없어 복사–붙여넣기 왕복으로 처리)
     · copyNotePrompt(min)  취약 개념+오답 이력 프롬프트를 클립보드로
     · importNotes()        AI가 만든 JSON '파일'을 업로드해 노트로 저장
     · applyNotes(arr)      파싱된 배열을 studyNotes에 반영(복습·정리 보존)
     · relWrongs(no)        각 개념에 내 실제 오답 문항을 붙임
     · vNotes()             저장된 노트를 보고 복습 체크·직접 정리·내보내기
   S.studyNotes[key] = {no,sec,title,unit,subjectNo,score,source,
                        summary,keyPoints,confuse,mnemonic,
                        wrongs,note,reviewed,createdAt,updatedAt}
   ══════════════════════════════════════════════════════════ */
// 이 개념(secNo)과 얽혀 틀린 문제들을 모은다.
//  misread = 내가 이 개념이라고 착각해 고른 오답 / missed = 정답이 이 개념인데 놓침 / topic = 문항 주제
function relWrongs(secNo){
  const out=[];
  Object.entries(S.answers).forEach(([qid,a])=>{
    if(a.ok)return;
    const q=D.qById[qid]; if(!q)return;
    const sel=a.sel;
    const selRefs=sel&&q.options[sel-1]?(q.options[sel-1].refs||[]):[];
    const ansRefs=q.options[q.answer-1]?(q.options[q.answer-1].refs||[]):[];
    const asMisread=selRefs.indexOf(secNo)>=0;
    const asMissed=!isNeg(q)&&ansRefs.indexOf(secNo)>=0;
    const asTopic=(q.refs||[]).slice(0,1).indexOf(secNo)>=0;
    if(asMisread||asMissed||asTopic)
      out.push({qid,sel,answer:q.answer,
        myText:sel&&q.options[sel-1]?q.options[sel-1].text:'모르겠음',
        ansText:q.options[q.answer-1]?q.options[q.answer-1].text:'',
        kind:asMisread?'misread':(asMissed?'missed':'topic')});
  });
  return out;
}
// 취약 개념 + 요약집 원문 + 최근 오답 + 메모를 담아 AI에게 줄 프롬프트를 만든다.
function notePrompt(min){
  const w=weakList(min).slice(0,15);
  if(!w.length)return '';
  const clean=t=>String(t==null?'':t).replace(/\s+/g,' ').trim();
  const concepts=w.map(x=>{
    const s=D.sec[x.no];
    const body=(s&&s.body||[]).filter(b=>b.type==='text').map(b=>clean(b.text)).filter(b=>b.length>=4).slice(0,10);
    return `### sec=${x.no} | ${x.sec.subjectNo}과목 / ${x.sec.unit} / ${x.sec.title} (취약 ${x.v}점)
요약집 내용: ${body.join(' | ')||'(요약 텍스트 없음)'}`;
  }).join('\n\n');
  const wrongs=Object.entries(S.answers).filter(([,a])=>!a.ok).slice(-25).map(([id,a])=>{
    const q=D.qById[id];
    if(!q)return `- ${id}`;
    const stem=(q.stem||[]).filter(b=>b.type==='text').map(b=>clean(b.text)).join(' ').slice(0,150)||'(지문 생략)';
    const opts=(q.options||[]).map((o,i)=>`${CIRC[i]}${clean(o.text).slice(0,40)}`).join(' ');
    const mine=a.sel?CIRC[a.sel-1]:'모르겠음';
    return `- [${id}] ${stem}\n  보기: ${opts}\n  내 답 ${mine} → 정답 ${CIRC[q.answer-1]}`;
  }).join('\n')||'- (없음)';
  const memos=Object.entries(S.notes).slice(-10).map(([id,t])=>`- ${id}: ${t}`).join('\n')||'- (없음)';
  return `너는 정보처리산업기사 필기 학습 코치다. 아래 [요약집 내용]과 [내가 틀린 기출문제]를 근거로, 학습자가 한눈에 학습·암기할 수 있는 노트로 정리하라.

[취약 개념과 요약집 내용]  (sec = 개념 번호, 그대로 되돌려줄 것)
${concepts}

[내가 틀린 기출문제 (학습·문제의 근거로 사용 / 요약집에 없는 새 내용이 있을 수 있음)]
${wrongs}

[참고: 내가 남긴 메모]
${memos}

[참고: 내가 모르는 것 (문제 풀이 중 직접 입력)]
${gapsText(15)}

[요구사항]
1. 노트는 위 [요약집 내용]과 [내가 틀린 기출문제] 둘 다를 근거로 만든다. 기출문제에는 나오지만 요약집에 없는 내용이라도, 시험에 필요한 것이면 반드시 학습 노트에 포함한다. (단, 이 두 자료 어디에도 없는 내용은 지어내지 말 것)
2. 각 취약 개념(sec)마다 노트 1개를 만들되, 요약집에는 없고 기출에만 새로 나온 내용이 있으면 그 내용으로 노트를 추가로 만든다 — 가장 관련 있는 sec 번호를 쓰고, 마땅한 요약 항목이 없으면 sec를 0으로 둔다.
   위 '내가 모르는 것'에 해당하면 그 부분을 우선적으로 짚어 준다(explain·myConfusion 활용).
3. 각 노트의 필드:
   - concept  : 핵심 개념을 짧게 1~3문장 (필수, 비우지 말 것)
   - memorize : 꼭 외워야 할 항목 배열 — 정의·공식·키워드·분류·순서 (필수)
   - compare  : 헷갈리기 쉬운 개념끼리의 비교 — "A vs B: 차이" 형태 배열 (없으면 [])
   - explain  : '추가 설명'. 자료만으로 이해가 부족하여, 설명을 덧붙이는 것이 학습에 실제로 도움이 된다고 판단될 때에만 짧게 덧붙인다. 도움이 안 되면 반드시 "" (빈 문자열).
   - myConfusion : '내가 헷갈린 부분에 대한 설명'. 위 기출·메모를 근거로, 그 헷갈림을 풀어주는 설명이 학습에 도움이 될 때에만 1~2문장으로 덧붙인다. 아니면 반드시 "".
4. explain 과 myConfusion 은 억지로 채우지 말 것 — 학습에 도움이 될 때만 넣고, 아니면 빈 문자열로 둔다.
5. sec는 위에서 준 숫자를 그대로 되돌려준다(기출 전용 새 내용은 0 허용).
6. 결과를 아래 형식의 JSON 배열로 만들고, "study-notes.json" 이라는 이름의 내려받을 수 있는 파일로 출력한다. (설명 문장 없이 JSON 배열만)

[{"sec":${w[0].no},"title":"${esc(w[0].sec.title)}","concept":"...","memorize":["...","..."],"compare":["A vs B: ..."],"explain":"","myConfusion":""}]`;
}
// 프롬프트 복사 — 오답 문항 텍스트가 필요하므로 회차 데이터를 먼저 받아둔다.
async function copyNotePrompt(){
  const wrongIds=Object.entries(S.answers).filter(([,a])=>!a.ok).map(([id])=>id);
  await Promise.all([...new Set(wrongIds.map(i=>i.slice(0,6)))].map(getExam));
  const p=notePrompt(NF.min);
  if(!p){toast('취약 개념 기록이 없습니다');return}
  navigator.clipboard.writeText(p).then(()=>toast('학습노트 프롬프트를 복사했습니다')).catch(()=>{
    const t=document.createElement('textarea');t.value=p;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('학습노트 프롬프트를 복사했습니다')});
}
// 값을 문자열 배열로 정규화 (문자열이면 한 항목으로 감싼다)
const toArr=v=>Array.isArray(v)?v.map(z=>String(z)).filter(z=>z.trim()):(v?[String(v)]:[]);
// AI가 만든 한 항목(x)을 기존 노트에 '병합'한다. 핵심: 값이 없는 필드는
// 기존 값을 그대로 두어, 빈/부분 업로드가 이미 저장된 내용을 지우지 않게 한다.
function mergeNote(x){
  if(!x||typeof x!=='object')return false;
  const sec=+x.sec||0;
  const meta=sec&&D.sec[sec]?D.sec[sec]:null;
  const key=sec?String(sec):('ai'+Date.now()+Math.floor(Math.random()*1e4));
  const prev=S.studyNotes[key]||null;
  const arrOr=(nv,ov)=>{const a=toArr(nv);return a.length?a:(ov||[])};
  const strOr=(nv,ov)=>{const s=(nv==null?'':String(nv)).trim();return s||ov||''};
  const memNv=toArr(x.memorize).length?x.memorize:x.keyPoints;   // 구 필드 하위호환
  const extNv=toArr(x.extra).length?x.extra:x.mnemonic;
  const n=S.studyNotes[key]={
    no:key, sec:sec||(prev?prev.sec:null), source:'ai',
    createdAt:prev?prev.createdAt:Date.now(),
    reviewed:prev?prev.reviewed:false,
    note:prev?prev.note:(sec?(S.secNotes[sec]||''):''),
    title:x.title||(prev?prev.title:'')||(meta?meta.title:'AI 학습노트'),
    unit:meta?meta.unit:(prev?prev.unit:(x.unit||'')),
    subjectNo:meta?meta.subjectNo:(prev?prev.subjectNo:(x.subjectNo||'')),
    score:sec?(S.weak[sec]||0):(prev?prev.score:0),
    concept:strOr(x.concept||x.summary, prev&&prev.concept),
    memorize:arrOr(memNv, prev&&prev.memorize),
    compare:arrOr(x.compare, prev&&prev.compare),
    explain:strOr(x.explain, prev&&prev.explain),
    myConfusion:strOr(x.myConfusion||x.confuse, prev&&prev.myConfusion),
    extra:arrOr(extNv, prev&&prev.extra),
    wrongs:sec?relWrongs(sec):(prev?prev.wrongs:[]),
    updatedAt:Date.now()
  };
  return true;
}
function applyNotes(arr){let n=0;arr.forEach(x=>{if(mergeNote(x))n++});return n;}
// AI가 만든 학습노트 JSON '파일'을 업로드해 불러온다.
// (AI에게 .json 파일로 내려받게 한 뒤 그 파일을 그대로 올리면 됨)
function importNotes(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let data; try{data=JSON.parse(r.result)}catch(x){alert('JSON 파일을 읽을 수 없습니다: '+x.message);return}
      // 배열이거나, {notes:[...]}/{studyNotes:[...]} 형태 모두 허용
      const arr=Array.isArray(data)?data
        :(data&&Array.isArray(data.notes)?data.notes
        :(data&&Array.isArray(data.studyNotes)?data.studyNotes:null));
      if(!arr){alert('학습노트 JSON 배열을 찾을 수 없습니다. [{...}] 형식의 .json 파일인지 확인하세요');return}
      const n=applyNotes(arr);
      if(!n){alert('불러올 노트가 없습니다');return}
      save(); toast(`${n}개 AI 학습노트를 저장했습니다`); vNotes();
    };
    r.readAsText(f);
  };
  inp.click();
}
// 요약집 원문을 AI에게 줄 다이제스트로 압축한다. ([번호] 제목: 내용 | 내용 …)
function memDigest(subj){
  if(!D.summary)return '';
  const clean=t=>String(t==null?'':t).replace(/\s+/g,' ').trim();
  const lines=[];
  D.summary.forEach(s=>{
    if(subj&&s.subjectNo!==subj)return;
    if((s.body||[]).some(b=>b.type==='code'))return;   // 코드 항목 제외
    const bl=(s.body||[]).filter(b=>b.type==='text'&&b.bullet).map(b=>clean(b.text));
    const tx=(s.body||[]).filter(b=>b.type==='text'&&!b.bullet).map(b=>clean(b.text));
    const body=(bl.length?bl:tx).filter(b=>b.length>=6).slice(0,8);
    if(!body.length)return;
    lines.push(`[${s.no}] ${s.title}: ${body.join(' | ')}`);
  });
  return lines.join('\n');
}
// 채점용 정규화: 공백·구두점 제거 + 소문자
function normA(s){return String(s==null?'':s).replace(/\s+/g,'').replace(/[·.,()\[\]{}'"`~\-_/:=→]/g,'').toLowerCase()}
// 입력값 v가 정답 ans와 일치하는가 (괄호 부연 제외·구두점 무시)
function ansMatch(v,ans){
  if(!v||!v.trim())return false;
  const variants=[ans, String(ans).replace(/\([^)]*\)/g,''), String(ans).replace(/[^가-힣a-zA-Z0-9]/g,'')];
  return variants.some(a=>normA(v)===normA(a));
}
/* ══════════════════════════════════════════════════════════
   10-d. 순서·개념 암기 테스트 (별도 페이지)
     · 순서형(seq)   : 화살표만 남기고 각 항목을 직접 채운다
     · 개념군형(group): 설명을 나열하고 각 개념 이름을 직접 채운다
   요약집 기반 AI 생성(프롬프트 복사 → drill.json 업로드) → S.drillBank
   ══════════════════════════════════════════════════════════ */
function drillPrompt(subj){
  const dig=memDigest(subj);
  if(!dig)return '';
  return `너는 정보처리산업기사 필기 암기 문제 출제자다. 아래 [요약집]을 근거로, 두 가지 유형의 '직접 채우기' 암기 문제를 만들어라.

[요약집]  (형식: [번호] 제목: 내용 | 내용 | …)
${dig}

[참고: 내가 모르는 것]
${gapsText(15)}

[유형]
A) 순서형(type:"seq") : 순서·단계·계층·강도 순서를 통째로 외우는 것. items 배열에 순서대로 담는다.
   예) OSI 7계층(물리→…→응용), 응집도 약함→강함, 결합도 약함→강함, SW 생명주기, 테스트 순서, DB 설계 단계 등.
B) 개념군형(type:"group") : 서로 유사해 헷갈리는 개념들의 묶음. pairs 배열에 {c:개념명, d:그 개념의 짧은 설명}.
   예) 키의 종류(기본키·후보키·외래키·슈퍼키·대체키), 정규형(1NF·2NF·3NF·BCNF), 조인 종류, 응집도/결합도 종류, 스케줄링 기법 등.

[규칙]
- 반드시 요약집에 있는 내용으로만. seq는 3~9개 항목, group은 3~6개 pair.
- 코드·SQL·계산/예제는 만들지 말 것.
- 아래 형식의 JSON 배열만 "drill.json" 파일로 출력한다(설명 문장 없이).

[{"type":"seq","title":"OSI 7계층 (하위→상위)","items":["물리 계층","데이터 링크 계층","네트워크 계층","전송 계층","세션 계층","표현 계층","응용 계층"]},{"type":"group","title":"키의 종류","pairs":[{"c":"기본키","d":"릴레이션에서 튜플을 유일하게 식별하는 대표 키"},{"c":"외래키","d":"다른 릴레이션의 기본키를 참조하는 속성"}]}]`;
}
function copyDrillPrompt(){

function importDrill(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{
      let data;try{data=JSON.parse(r.result)}catch(x){alert('JSON 파일을 읽을 수 없습니다: '+x.message);return}
      const arr=Array.isArray(data)?data:(data&&Array.isArray(data.drill)?data.drill:(data&&Array.isArray(data.items)?data.items:null));
      if(!arr){alert('문제 JSON 배열을 찾을 수 없습니다');return}
      const seen=new Set((S.drillBank||[]).map(x=>x.type+'|'+(x.title||'')));
      let n=0;
      arr.forEach(x=>{
        if(!x||typeof x!=='object')return;
        const title=String(x.title||'').trim();
        if(x.type==='seq'){
          const items=(Array.isArray(x.items)?x.items:[]).map(s=>String(s).trim()).filter(Boolean);
          if(items.length<2)return;
          const key='seq|'+title; if(seen.has(key))return; seen.add(key);
          S.drillBank.push({type:'seq',title:title||'순서 외우기',items}); n++;
        }else if(x.type==='group'){
          const pairs=(Array.isArray(x.pairs)?x.pairs:[]).map(pp=>({c:String(pp&&pp.c||'').trim(),d:String(pp&&pp.d||'').trim()})).filter(pp=>pp.c&&pp.d);
          if(pairs.length<2)return;
          const key='group|'+title; if(seen.has(key))return; seen.add(key);
          S.drillBank.push({type:'group',title:title||'개념 맞히기',pairs}); n++;
        }
      });
      if(!n){alert('불러올 문제가 없습니다 (seq/group 형식인지 확인하세요)');return}
      save(); toast(`${n}개 암기 세트를 추가했습니다`); vDrill();
    };

}

function startDrill(){

  }));

}

function checkDrill(){
  const it=DR.items[DR.i];

  targets.forEach((ans,j)=>{const el=document.getElementById('dr_'+j);const v=el?el.value.trim():'';answers.push(v);oks.push(ansMatch(v,ans))});
  DR.res[DR.i]={answers,oks};

  const id=drillId(it);
  if(oks.length&&oks.every(Boolean)){S.drillMastered[id]=true; delete S.drillWrong[id]}

    먼저 기출을 풀어 오답을 쌓은 뒤 위에서 <b>프롬프트를 복사</b>해 AI로 만들어 보세요.</div>`}

function toggleReviewed(no){const n=S.studyNotes[no];if(!n)return;n.reviewed=!n.reviewed;n.updatedAt=Date.now();save();vNotes()}
function saveNoteText(no){const n=S.studyNotes[no];if(!n)return;const el=document.getElementById('nn'+no);
  n.note=el.value.trim();n.updatedAt=Date.now();save();toast('정리를 저장했습니다')}
function delNote(no){if(!confirm('이 학습노트를 삭제할까요?'))return;delete S.studyNotes[no];save();vNotes()}
function notesMarkdown(){
  return Object.values(S.studyNotes).sort((a,b)=>(b.score||0)-(a.score||0)).map(n=>{
    let s=`## ${n.title}  (${n.subjectNo?n.subjectNo+'과목 · ':''}${n.unit||''}) — 취약 ${n.score||0}점${n.reviewed?' ✔복습완료':''}\n\n`;
    if(n.concept)s+='### 핵심 개념\n'+n.concept+'\n\n';
    if(n.memorize&&n.memorize.length)s+='### 외울 내용\n'+n.memorize.map(k=>'- '+k).join('\n')+'\n\n';
    if(n.compare&&n.compare.length)s+='### 헷갈리는 개념 비교\n'+n.compare.map(k=>'- '+k).join('\n')+'\n\n';
    if(n.explain)s+='### 추가 설명\n'+n.explain+'\n\n';
    if(n.myConfusion)s+='### 내가 헷갈린 부분\n'+n.myConfusion+'\n\n';
    if(n.extra&&n.extra.length)s+='### 그 외\n'+n.extra.map(k=>'- '+k).join('\n')+'\n\n';
    if(n.summary)s+='### 개념 정리\n'+n.summary+'\n\n';
    if(n.keyPoints&&n.keyPoints.length)s+='### 핵심 포인트\n'+n.keyPoints.map(k=>'- '+k).join('\n')+'\n\n';
    if(n.confuse)s+='### 혼동 포인트\n'+n.confuse+'\n\n';
    if(n.mnemonic)s+='### 암기 팁\n'+n.mnemonic+'\n\n';
    if(n.bullets&&n.bullets.length)s+='### 개념 정리\n'+n.bullets.map(b=>'- '+b).join('\n')+'\n\n';
    if(n.terms&&n.terms.length)s+='### 관련 용어\n'+n.terms.map(t=>`- **${t.term}**: ${t.desc}`).join('\n')+'\n\n';
    if(n.wrongs&&n.wrongs.length)s+='### 내가 틀린 문제\n'+n.wrongs.map(w=>`- ${w.qid}: 내 답 ${w.sel?CIRC[w.sel-1]:'모르겠음'} → 정답 ${CIRC[w.answer-1]} ${w.ansText||''}`).join('\n')+'\n\n';
    if(n.note)s+='### 내 정리\n'+n.note+'\n\n';
    return s;
  }).join('\n---\n\n');
}
function copyNotes(){
  const md=notesMarkdown();
  if(!md){toast('저장된 노트가 없습니다');return}
  navigator.clipboard.writeText(md).then(()=>toast('노트를 마크다운으로 복사했습니다')).catch(()=>{
    const t=document.createElement('textarea');t.value=md;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('노트를 마크다운으로 복사했습니다')});
}

/* ══════════════════════════════════════════════════════════
   11. 문제 자동 생성 (핵심요약집 기반, 완전 클라이언트)
   ══════════════════════════════════════════════════════════ */
let G={mode:'weak',n:10,items:null,i:0,ans:{}};
async function vGen(){
  if(G.items){return drawGen()}
  if(!D.gloss){app().innerHTML='<div class="empty">준비 중…</div>';await needGloss()}
  const w=weakList(2);
  app().innerHTML=`
  <h2 class="sec">문제 자동 생성</h2>
  <div class="card small muted">핵심요약집 193개 항목의 <b>불릿·용어 정의</b>를 재료로 새 4지선다 문제를 만듭니다.
  같은 과목 안에서 오답 보기를 뽑아 난이도를 맞춥니다.</div>
  <h2 class="sec">출제 범위</h2>
  <div class="pill">
    <button class="${G.mode==='weak'?'on':''}" onclick="G.mode='weak';vGen()">취약 개념 (${w.length})</button>
    <button class="${G.mode==='all'?'on':''}" onclick="G.mode='all';vGen()">전체 랜덤</button>
    ${[1,2,3].map(n=>`<button class="${G.mode==='s'+n?'on':''}" onclick="G.mode='s${n}';vGen()">${n}과목</button>`).join('')}
  </div>
  <h2 class="sec">문항 수</h2>
  <div class="pill">${[5,10,15,20].map(n=>`<button class="${G.n===n?'on':''}" onclick="G.n=${n};vGen()">${n}문항</button>`).join('')}</div>
  ${G.mode==='weak'&&!w.length?'<div class="card tight small" style="color:var(--wn)">취약 개념 기록이 없습니다. 기출을 먼저 풀거나 다른 범위를 고르세요.</div>':''}
  <button class="btn pri" style="width:100%;margin-top:14px;padding:13px" onclick="makeGen()">문제 만들기</button>
  ${S.gen.length?`<h2 class="sec">지난 생성 기록</h2>
    <div class="card tight small muted">총 ${S.gen.length}세트 · 마지막 ${new Date(S.gen[S.gen.length-1].t).toLocaleString('ko-KR')}</div>`:''}
  <h2 class="sec">AI로 더 정교하게 만들기</h2>
  <div class="card tight small muted">아래 버튼을 누르면 <b>내 취약 개념 + 오답 이력</b>을 정리한 프롬프트가 복사됩니다.
  Claude·ChatGPT에 붙여넣으면 해설까지 있는 문제를 만들 수 있고, 결과 JSON을 다시 불러올 수 있습니다.
  <div class="grid2" style="margin-top:10px">
    <button class="btn sm" onclick="copyPrompt()">프롬프트 복사</button>
    <button class="btn sm" onclick="importGen()">생성 JSON 불러오기</button>
  </div></div>
  <div style="height:24px"></div>`;
}
function pool(){
  let secs=D.summary.slice();
  if(G.mode.startsWith('s'))secs=secs.filter(s=>s.subjectNo===+G.mode[1]);
  else if(G.mode==='weak'){const w=new Set(weakList(2).map(x=>x.no));
    const ws=secs.filter(s=>w.has(s.no)); if(ws.length>=3)secs=ws;}
  return secs;
}
// 문제 재료로 쓸 만한 불릿만 (예제 풀이 과정·숫자 나열은 제외)
function bullets(s){
  return s.body.filter(b=>{
    if(b.type!=='text'||!b.bullet)return false;
    const t=b.text; if(t.length<8||t.length>90)return false;
    if(/^\d+\s*회전|^초기\s*상태|^예제|^\d+단계/.test(t))return false;
    const dig=(t.match(/[0-9]/g)||[]).length;
    return dig/t.length<=0.3;
  }).map(b=>b.text);
}
function makeGen(){
  const secs=pool(), out=[];
  const rich=shuffle(secs.filter(s=>bullets(s).length>=3));
  // 오답 보기는 되도록 "같은 단원"에서 뽑아 난이도를 맞춘다 (없으면 같은 과목)
  const others=s=>{
    const near=D.summary.filter(x=>x.no!==s.no&&x.unit===s.unit).flatMap(bullets);
    const far =D.summary.filter(x=>x.no!==s.no&&x.subjectNo===s.subjectNo&&x.unit!==s.unit).flatMap(bullets);
    return [...shuffle(near),...shuffle(far)].slice(0,12);
  };
  // A) "~에 해당하지 않는 것은?"
  for(const s of rich){
    if(out.length>=Math.ceil(G.n*0.5))break;
    const b=shuffle(bullets(s)).slice(0,3);
    // 정답 보기들과 머리말(: 앞)이 겹치는 오답은 모호해지므로 제외
    const head=t=>t.split(/[:：(]/)[0].trim().replace(/\s/g,'');
    const hs=new Set(b.map(head));
    const d=others(s).filter(x=>!b.includes(x)&&!hs.has(head(x)))[0];
    if(!d)continue;
    const opts=shuffle([...b.map(t=>({t,ok:0})),{t:d,ok:1}]);
    out.push({type:'notin',sec:s.no,q:`다음 중 「${s.title}」에 해당하지 않는 것은?`,
      options:opts.map(o=>o.t),answer:opts.findIndex(o=>o.ok)+1,
      why:`「${s.title}」의 내용이 아닙니다. 나머지 3개는 해당 항목의 내용입니다.`});
  }
  // B) 용어 → 설명 매칭
  const gl=shuffle(D.gloss.filter(g=>secs.some(s=>s.no===g.sec)&&g.desc.length>=12&&g.desc.length<=140));
  const near=g=>{
    const a=shuffle(D.gloss.filter(x=>x.unit===g.unit&&x.term!==g.term));
    const b=shuffle(D.gloss.filter(x=>x.subject===g.subject&&x.unit!==g.unit&&x.term!==g.term));
    return [...a,...b];
  };
  for(const g of gl){
    if(out.length>=G.n)break;
    const dis=near(g).slice(0,3);
    if(dis.length<3)continue;
    const opts=shuffle([{t:g.term,ok:1},...dis.map(x=>({t:x.term,ok:0}))]);
    out.push({type:'define',sec:g.sec,q:`다음 설명에 해당하는 것은?\n\n「${g.desc}」`,
      options:opts.map(o=>o.t),answer:opts.findIndex(o=>o.ok)+1,
      why:`${g.term} : ${g.desc}`});
  }
  // C) 설명 고르기 (역방향)
  for(const g of gl){
    if(out.length>=G.n)break;
    const dis=near(g).filter(x=>x.desc!==g.desc).slice(0,3);
    if(dis.length<3)continue;
    const opts=shuffle([{t:g.desc,ok:1},...dis.map(x=>({t:x.desc,ok:0}))]);
    out.push({type:'match',sec:g.sec,q:`「${g.term}」에 대한 설명으로 옳은 것은?`,
      options:opts.map(o=>o.t),answer:opts.findIndex(o=>o.ok)+1,why:`${g.term} : ${g.desc}`});
  }
  if(!out.length){toast('생성 재료가 부족합니다. 범위를 넓혀보세요');return}
  G.items=shuffle(out).slice(0,G.n); G.i=0; G.ans={};
  S.gen.push({t:Date.now(),n:G.items.length,mode:G.mode}); if(S.gen.length>30)S.gen.shift(); save();
  drawGen();
}
function drawGen(){
  const it=G.items[G.i], picked=G.ans[G.i];
  document.getElementById('hTitle').textContent='자동 생성 문제';
  app().innerHTML=`
  <div class="row" style="margin:12px 0 4px">
    <span class="tiny muted">${G.i+1} / ${G.items.length}</span>
    <div class="bar" style="flex:1"><i style="width:${(G.i+1)/G.items.length*100}%"></i></div>
    <button class="btn sm gh" onclick="G.items=null;go('#/gen')">나가기</button>
  </div>
  <div class="card">
    <div class="qhd"><span class="chip">자동생성</span><span class="chip">${esc(secTitle(it.sec))}</span></div>
    <div class="stem"><p style="white-space:pre-wrap">${esc(it.q)}</p></div>
    <div class="opts">${it.options.map((t,k)=>{
      let c='opt'; if(picked){ if(k+1===it.answer)c+=' right'; else if(k+1===picked)c+=' wrong'; }
      return `<button class="${c}" ${picked?'disabled':`onclick="genPick(${k+1})"`}><b>${CIRC[k]}</b><span>${esc(t)}</span></button>`}).join('')}</div>
    ${picked?`<div class="fb ${picked===it.answer?'ok':'no'}"><b>${picked===it.answer?'✔ 정답':'✘ 오답'}</b> — 정답 ${CIRC[it.answer-1]}번
      <div class="small" style="margin-top:6px">${esc(it.why)}</div>
      <div class="small" style="margin-top:6px">📖 <a href="#/sec?no=${it.sec}">${esc(secTitle(it.sec))}</a> 요약 보기</div></div>`:''}
  </div>
  <div style="height:70px"></div>
  <div class="sticky-bot"><div class="wrap row">
    <button class="btn" onclick="genMv(-1)" ${G.i?'':'disabled'}>‹ 이전</button><div style="flex:1"></div>
    <button class="btn ${picked?'pri':''}" onclick="genMv(1)">${G.i===G.items.length-1?'끝내기':'다음 ›'}</button>
  </div></div>`;
}
function genPick(k){
  const it=G.items[G.i]; G.ans[G.i]=k;
  if(k!==it.answer)S.weak[it.sec]=(S.weak[it.sec]||0)+2; else S.weak[it.sec]=Math.max(0,(S.weak[it.sec]||0)-1);
  save(); drawGen();
}
function genMv(d){
  if(G.i+d>=G.items.length){
    const ok=Object.entries(G.ans).filter(([i,k])=>+k===G.items[i].answer).length;
    const tot=Object.keys(G.ans).length;
    G.items=null;
    app().innerHTML=`<h2 class="sec">생성 문제 결과</h2>
      <div class="grid3"><div class="kpi"><div class="v">${tot}</div><div class="k">푼 문제</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${ok}</div><div class="k">정답</div></div>

/* ── 답 정규화 · 채점 ──────────────────────────────────── */
// 키보드로 못 치는 기호를 칠 수 있는 문자로 바꾼다.
// 답을 ①·㉠·→ 없이 입력해도 정답으로 인정하기 위한 것.
const P_SYM={'㉠':'ㄱ','㉡':'ㄴ','㉢':'ㄷ','㉣':'ㄹ','㉤':'ㅁ','㉥':'ㅂ','㉦':'ㅅ','㉧':'ㅇ',
             'ⓐ':'a','ⓑ':'b','ⓒ':'c','ⓓ':'d','ⓔ':'e','Ⓐ':'a','Ⓑ':'b','Ⓒ':'c','Ⓓ':'d',
             '①':' ','②':' ','③':' ','④':' ','⑤':' ','⑥':' ','⑦':' ','⑧':' ','⑨':' ',
             '→':' ','⇒':' ','⟶':' ','～':'~','∼':'~'};
const pSym=s=>String(s==null?'':s).replace(/[㉠-㉧ⓐ-ⓔⒶ-Ⓓ①-⑨→⇒⟶～∼]/g,ch=>P_SYM[ch]||ch);

const pn =s=>pSym(s).replace(/\r/g,'').split('\n').map(x=>x.replace(/\s+$/,'')).join('\n').replace(/\n+$/,'').replace(/^\n+/,'');
const pnL=s=>pn(s).replace(/\s/g,'');
// 번호 매김(1. 1) 가. …)과 구분자를 걷어낸 '알맹이만' 비교용 키
const pnK=s=>pn(s).replace(/(^|[\s,;])[0-9ㄱ-ㅎa-e][.)]\s*/g,'$1')
                  .replace(/\s/g,'').replace(/[·ㆍ>\-–—_()[\]{}'"`,.:;]/g,'').toLowerCase();

// "① 외부 ② 개념 ③ 내부" → ["외부","개념","내부"]  (칸별 부분 채점용)
function pParts(a){
  const s=String(a==null?'':a);
  if(!/[①②③④⑤⑥⑦⑧⑨]/.test(s)) return [];
  return s.split(/[①②③④⑤⑥⑦⑧⑨]/).map(x=>x.replace(/^[\s:.]*/,'').trim())
          .filter(x=>pnK(x).length>0);
}

/* 입력 형식 안내 — 정답의 생김새에서 뽑아낸다 */
function pFmt(q){
  const parts=pParts(q.a);
  if(parts.length>1)
    return '괄호 순서대로 <b>'+parts.length+'개</b>를 쉼표나 줄바꿈으로 구분해 입력하세요. ①②③ 번호는 빼고 값만 써도 됩니다.';
  if(q.type==='order')
    return '순서대로 쉼표(,)로 구분해 입력하세요. 화살표(->)를 쓰거나 붙여 써도 됩니다.';
  if(q.type==='code'&&q.a.indexOf('\n')>=0)
    return '출력되는 그대로, <b>줄바꿈까지</b> 맞춰 입력하세요.';
  if(q.type==='code')
    return '출력되는 값을 그대로 입력하세요. 서식(소수 자릿수·값 사이 공백)까지 채점합니다.';
  if(/[,]/.test(q.a)&&q.choices)
    return '해당하는 것을 <b>모두</b> 쉼표로 구분해 입력하세요. (예: ㄱ, ㄴ)';
  if(q.type==='sql') return 'SQL문을 입력하세요. 대소문자는 구분하지 않습니다.';
  return '답 하나를 입력하세요. 한글·영문 어느 쪽으로 써도 됩니다.';
}

function pDiag(user,ans){
  const u=pn(user), a=pn(ans);
  if(u===a) return null;
  if(!u) return {k:'미입력',d:'답을 적지 않았습니다.'};
  if(pnL(u)===pnL(a)) return {k:'공백·개행만 다름',d:'값 자체는 맞았습니다. 실기는 출력 서식까지 채점되므로 printf/println의 공백·개행 위치를 확인하세요.'};
  const un=Number(u), an=Number(a);
  if(u.indexOf('\n')<0&&a.indexOf('\n')<0&&isFinite(un)&&isFinite(an)&&u!==''){
    if(Math.abs(un-an)===1) return {k:'1 차이 (off-by-one)',d:'반복 횟수·배열 인덱스 경계를 한 칸 더 세었거나 덜 세었습니다. < 와 <=, 반복이 끝난 뒤 남는 i값을 확인하세요.'};
    if(un===-an&&an!==0)   return {k:'부호 반대',d:'뺄셈 순서 또는 음수 처리 부분을 확인하세요.'};
    if(un===an*10||un*10===an) return {k:'자릿수 밀림',d:'누적 위치나 자릿수 계산(/ 10, % 10)을 확인하세요.'};
    if(Math.abs(un-an)<=3) return {k:'근접 오답',d:'반복 조건이나 초기값이 한두 단계 어긋났습니다. 첫 회차 값부터 손으로 따라가 보세요.'};
    return {k:'값이 다름',d:'연산 순서나 누적 변수의 초기값을 확인하세요.'};
  }
  const ul=u.split('\n'), al=a.split('\n');
  if(ul.length!==al.length) return {k:'출력 줄 수 다름 ('+ul.length+' vs '+al.length+')',d:'반복 횟수 또는 개행 위치를 잘못 판단했습니다.'};
  if(ul.slice().sort().join('|')===al.slice().sort().join('|')) return {k:'출력 순서 다름',d:'값은 모두 맞지만 순서가 다릅니다. 반복 방향(증가/감소)이나 중첩 순서를 확인하세요.'};
  return {k:'값이 다름',d:'코드를 한 줄씩 따라가며 변수값을 적어 보세요.'};
}

function pGrade(q,user){
  const u=pn(user);
  if(!pnK(u)) return {ok:false,pat:'미입력'};
  const cands=[q.a].concat(q.alt||[]).filter(Boolean);
  if(cands.some(c=>pn(c)===u))  return {ok:true,pat:''};
  if(cands.some(c=>pnL(c)===pnL(u))) return {ok:true,pat:q.type==='code'?'공백·개행만 다름':''};
  const uk=pnK(u);
  if(cands.some(c=>pnK(c)===uk)) return {ok:true,pat:''};
  if(q.type!=='code'&&cands.some(c=>{const k=pnK(c);
      return k.length>=3&&(uk.indexOf(k)>=0||(uk.length>=3&&k.indexOf(uk)>=0))}))
    return {ok:true,pat:''};
  const parts=pParts(q.a);
  if(parts.length>1){
    const got=parts.filter(p=>{const k=pnK(p); return k&&uk.indexOf(k)>=0}).length;
    if(got) return {ok:got===parts.length,part:[got,parts.length],
                    pat:got===parts.length?'':'일부만 맞음 ('+got+'/'+parts.length+')'};
  }
  if(q.type==='code'){ const d=pDiag(u,q.a); if(d) return {ok:false,pat:d.k,diag:d} }
  return {ok:false,pat:'답이 다름'};
}

/* ── 코드 하이라이팅 ───────────────────────────────────── */
const P_KW=/\b(if|else|for|while|do|switch|case|break|continue|return|goto|new|class|public|private|protected|static|void|final|extends|implements|import|package|try|catch|finally|throw|throws|def|elif|in|not|and|or|None|True|False|print|struct|union|typedef|sizeof|include|define|main|select|from|where|group|by|having|order|insert|into|values|update|set|delete|create|table|distinct|between|and|not|join|using|check|unique|index)\b/gi;
const P_TY=/\b(int|long|short|float|double|char|boolean|unsigned|signed|String|self|varchar)\b/g;
function hl(src){
  // 색을 입힌 조각은 곧바로 자리표시자로 빼 둔다. 그래야 뒤따르는 패스가
  // 방금 넣은 마크업(class= 등)을 다시 키워드로 잡는 일이 없다.
  // 자리표시자 글자는 q~z — 어떤 키워드도 이 글자들만으로 이루어지지 않는다.
  let s=esc(src); const box=[];
  const enc=n=>String(n).split('').map(d=>String.fromCharCode(113+ +d)).join('');
  const dec=t=>+t.split('').map(ch=>ch.charCodeAt(0)-113).join('');
  const stash=(t,c)=>{box.push('<span class="'+c+'">'+t+'</span>');return '\x01'+enc(box.length-1)+'\x01'};
  s=s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g,m=>stash(m,'cm'));
  s=s.replace(/(&quot;(?:[^&\n]|&(?!quot;))*?&quot;|&#39;[^\n]*?&#39;)/g,m=>stash(m,'st'));
  s=s.replace(P_TY,m=>stash(m,'ty')).replace(P_KW,m=>stash(m,'kw'));
  s=s.replace(/\b(\d+\.?\d*)\b/g,m=>stash(m,'nu'));
  s=s.replace(/\x01([q-z]+)\x01/g,(_,t)=>box[dec(t)]);
  return s;
}
const nl2br=t=>esc(t).replace(/\n/g,'<br>');
const examTitle=id=>{ if(id==='ai')return 'AI 유사문제';
  const e=(PD.idx.exams||[]).filter(x=>x.id===id)[0]; return e?e.title:id };

function pDone(list){ const A=PS().ans; return list.filter(q=>A[q.id]).length }

function pBar(done,ok,total){
  const d=total?Math.round(done/total*100):0, o=total?Math.round(ok/total*100):0;
  return '<div class="mini" style="margin-top:6px"><i style="width:'+o+'%;background:var(--ok)"></i></div>'+
         '<div class="tiny muted" style="margin-top:3px">'+done+'/'+total+' 풀이 · 정답 '+ok+'개'+(d?' ('+Math.round(ok/Math.max(done,1)*100)+'%)':'')+'</div>';
}

/* ══ 문제 풀이 ═════════════════════════════════════════ */
async function vPPlay(a){
  if(!await pLoad())return;
  const A=PS().ans;
  let list=[], title='';
  if(a.id){ const q=PD.byId[a.id]; if(q){list=[q];title=q.exam+' '+q.no+'번'} }
  else if(a.exam){ list=(PD.byExam[a.exam]||[]).slice(); title=examTitle(a.exam) }
  else if(a.type){ list=PD.exam.filter(q=>q.type===a.type); title=TLABEL[a.type]||a.type }
  else if(a.lang){ list=PD.exam.filter(q=>q.lang===a.lang); title=a.lang }
  else if(a.tag){ list=PD.exam.filter(q=>(q.tags||[]).indexOf(a.tag)>=0); title=a.tag }
  else if(a.note){ const n=PD.note.filter(x=>x.id===a.note)[0];
                   if(n){ list=(n.qids||[]).map(i=>PD.byId[i]).filter(Boolean); title=n.title } }
  else if(a.mode==='wrong'){ list=PD.exam.filter(q=>A[q.id]&&!A[q.id].ok); title='틀린 문제' }
  else if(a.mode==='unsolved'){ list=pShuffle(PD.exam.filter(q=>!A[q.id]&&!q.partial)); title='안 푼 문제' }
  else { list=pShuffle(PD.exam.filter(q=>!q.partial)); title='랜덤' }
  if(a.n) list=list.slice(0,+a.n);
  if(!list.length){ app().innerHTML='<div class="empty">해당하는 문제가 없습니다.</div>'; return }

  const first=list.findIndex(q=>!A[q.id]);
  PP={list:list,i:first<0?0:first,title:title,shown:{},from:location.hash};
  list.forEach(q=>{ if(A[q.id])PP.shown[q.id]=1 });
  pDraw();
}
function pShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function pDraw(){
  const q=PP.list[PP.i], rec=pRecOf(q), shown=!!PP.shown[q.id];
  document.getElementById('hTitle').textContent=PP.title;
  app().innerHTML=
  '<div class="row small" style="margin:10px 0 6px">'+
    '<span class="muted">'+(PP.i+1)+' / '+PP.list.length+'</span><div style="flex:1"></div>'+
    '<button class="btn sm gh" onclick="pMv(-1)" '+(PP.i?'':'disabled')+'>이전</button>'+
    '<button class="btn sm gh" onclick="pMv(1)" '+(PP.i<PP.list.length-1?'':'disabled')+'>다음</button>'+
  '</div>'+
  pQCard(q,rec,shown)+
  (PP.i===PP.list.length-1&&shown?'<div class="card tight" style="margin-top:12px"><div class="row">'+
    '<div style="flex:1" class="small"><b>이 묶음을 모두 풀었습니다.</b></div>'+
    '<button class="btn sm" onclick="go(\'#/pwrong\')">오답노트</button></div></div>':'');
  const ta=document.getElementById('pAns');
  if(ta){
    ta.focus();
    ta.onkeydown=e=>{ if(e.key==='Enter'&&(!e.shiftKey)&&ta.rows<=2){e.preventDefault();pSubmit()} };
  }
}

      :'')+
     '<div class="row" style="margin-top:11px;gap:7px"><button class="btn sm gh" onclick="pRetry(\''+q.id+'\')">다시 풀기</button>'+

function pSubmit(){
  const q=PP.list[PP.i], ta=document.getElementById('pAns'), v=ta?ta.value:'';
  const g=pGrade(q,v);
  pRec(q,g,v); PP.shown[q.id]=1; pDraw();
  if(g.part&&!g.ok) toast('부분 정답 — '+g.part[0]+'/'+g.part[1]+'칸');
  else if(g.ok&&g.pat) toast('값은 맞았습니다 — '+g.pat);
}
function pGiveUp(){
  const q=PP.list[PP.i];
  pRec(q,{ok:false,pat:'모르겠음'},''); PP.shown[q.id]=1; pDraw();
}
function pMv(d){
  const n=PP.i+d; if(n<0||n>=PP.list.length)return;
  PP.i=n; window.scrollTo(0,0); pDraw();
}
function pRetry(id){
  const q=pQOf(id); if(!q)return;
  if(q.ai) delete PA().aiAns[id]; else delete PS().ans[id];
  save();
  if(PP&&PP.list.some(x=>x.id===id)){ delete PP.shown[id]; PP.i=PP.list.findIndex(x=>x.id===id); pDraw(); }
  else { PP={list:[q],i:0,title:'다시 풀기',shown:{},from:location.hash}; pDraw() }
}
function pCopyPrompt(id){
  const q=PD.byId[id], rec=PS().ans[id];
  const p='정보처리산업기사 실기 기출 문제입니다. 아래 '+(q.lang||'')+' 코드의 실행 흐름을 한 줄씩, 변수값 변화표와 함께 한국어로 설명해 주세요.\n'+
    '문제: '+q.q+'\n제가 쓴 답: '+(rec?rec.v:'(없음)')+'\n실제 정답: '+q.a+'\n'+
    '제가 왜 틀렸는지, 어떤 개념을 착각한 것인지 짚어 주세요.\n\n```\n'+(q.code||'')+'\n```';
  navigator.clipboard.writeText(p).then(()=>toast('프롬프트를 복사했습니다')).catch(()=>toast('복사에 실패했습니다'));
}

function pNoteList(){

    (!kw||(n.title+' '+n.sum+' '+(n.tags||[]).join(' ')).toLowerCase().indexOf(kw)>=0));

function pNoteRows(list){
  if(!list.length) return '<div class="empty">검색 결과가 없습니다.</div>';
  const R=PSr(), A=PS().ans;
  return '<div class="card tight">'+list.map(n=>{
    const qs=(n.qids||[]).map(id=>PD.byId[id]).filter(Boolean);

      '<div class="g"><b>'+(R[n.id]?'✔ ':'')+esc(n.title)+'</b>'+
      '<span class="s">'+esc(n.cat)+' · 기출 '+qs.length+'문항'+(wrong?' · 오답 '+wrong+'개':'')+'</span></div>'+
      '<span class="chip'+(R[n.id]?' ok2':'')+'">'+(R[n.id]?'완료':'→')+'</span></div>';
  }).join('')+'</div>';
}

async function vPNv(a){
  if(!await pLoad())return;
  const n=PD.note.filter(x=>x.id===a.id)[0];
  if(!n){go('#/pnote');return}
  document.getElementById('hTitle').textContent=n.title;
  const R=PSr(), A=PS().ans;
  const qs=(n.qids||[]).map(id=>PD.byId[id]).filter(Boolean);
  const done=qs.filter(q=>A[q.id]).length, ok=qs.filter(q=>A[q.id]&&A[q.id].ok).length;
  const i=PD.note.indexOf(n), prev=PD.note[i-1], next=PD.note[i+1];

/* ══════════════════════════════════════════════════════════
   실기 AI 학습 — 취약점 분석 · 개념 요약 · 유사문제 생성
   정적 사이트라 API 키를 넣을 수 없어, 필기 쪽과 같은 복사–붙여넣기
   왕복으로 처리한다: 프롬프트 복사 → AI가 .json 파일 생성 → 업로드.
     · pAiDiag()        내 오답에서 뽑은 취약점 진단 (태그·유형·실수 패턴)
     · pCopyNotePrompt()  개념 요약 프롬프트 → prac-notes.json
     · pCopyGenPrompt()   유사문제 프롬프트  → prac-drill.json
     · pImport(kind)    AI가 만든 JSON 파일을 읽어 저장
   S.prac.aiNote[tag] = {tag,title,concept,memorize[],compare[],myMistake,drill[],...}
   S.prac.aiQ         = [{id:'ai…',ai:1,type,lang,q,code,a,alt[],why,tags[]}]
   S.prac.aiAns[id]   = {ok,v,t,pat}
   ══════════════════════════════════════════════════════════ */
function PA(){ const P=PS(); P.aiNote=P.aiNote||{}; P.aiQ=P.aiQ||[]; P.aiAns=P.aiAns||{}; return P }
const pRecOf=q=>q&&q.ai?PA().aiAns[q.id]:PS().ans[q.id];
const pQOf=id=>PD.byId[id]||PA().aiQ.filter(x=>x.id===id)[0];

/* ── 취약점 진단 ──────────────────────────────────────── */
function pAiDiag(){
  const A=PS().ans, ids=Object.keys(A);
  const wrong=ids.filter(id=>!A[id].ok);
  const by=(keyOf)=>{
    const m={};
    ids.forEach(id=>{ const q=PD.byId[id]; if(!q)return;
      [].concat(keyOf(q)||[]).forEach(k=>{ if(!k)return;
        m[k]=m[k]||{k:k,n:0,ok:0}; m[k].n++; if(A[id].ok)m[k].ok++; }); });
    return Object.values(m).map(x=>(x.rate=Math.round(x.ok/x.n*100),x))
                 .sort((a,b)=>a.rate-b.rate||b.n-a.n);
  };
  return {
    n:ids.length, wrong:wrong.length,
    rate:ids.length?Math.round((ids.length-wrong.length)/ids.length*100):0,
    tags:by(q=>q.tags), types:by(q=>TLABEL[q.type]), langs:by(q=>q.lang),
    exams:by(q=>examTitle(q.exam)), pats:pPatStats()
  };
}

/* ── 프롬프트 재료 ────────────────────────────────────── */
function pWrongDigest(limit){
  const A=PS().ans;
  const L=PD.exam.filter(q=>A[q.id]&&!A[q.id].ok).slice(-(limit||25));
  if(!L.length) return '- (없음)';
  return L.map(q=>{
    const a=A[q.id];
    return '- ['+q.id+'] '+examTitle(q.exam)+' '+q.no+'번 · '+TLABEL[q.type]+(q.lang?'('+q.lang+')':'')+
      '\n  개념: '+((q.tags||[]).join(', ')||'-')+
      '\n  문제: '+String(q.q||'').replace(/\s+/g,' ').slice(0,180)+
      (q.code?'\n  코드:\n'+String(q.code).split('\n').slice(0,26).map(x=>'    '+x).join('\n'):'')+
      '\n  내 답: '+(a.v||'(빈칸)')+'  → 정답: '+String(q.a).replace(/\n/g,' / ')+
      (a.pat?'\n  채점기가 본 원인: '+a.pat:'');
  }).join('\n');
}
function pWeakDigest(){
  const d=pAiDiag();
  const line=(x)=>'- '+x.k+' : '+x.n+'문항 중 '+x.ok+'개 정답 ('+x.rate+'%)';
  return {
    tags:d.tags.filter(x=>x.n>=2&&x.rate<80).slice(0,12).map(line).join('\n')||'- (기록 없음)',
    types:d.types.map(line).join('\n')||'- (기록 없음)',
    pats:d.pats.slice(0,6).map(p=>'- '+p.k+' : '+p.v+'회').join('\n')||'- (없음)',
    d:d
  };
}
function pCopy(text,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done).catch(()=>pCopyFallback(text,done));
  else pCopyFallback(text,done);
}
function pCopyFallback(text,done){
  const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);
  t.select();try{document.execCommand('copy')}catch(e){}t.remove();done();
}

 {"type":"short","q":"다음 설명에 해당하는 프로토콜을 영문 약어로 쓰시오. …","a":"ARP","alt":["Address Resolution Protocol"],"why":"…","tags":["네트워크"]}]`;
  pCopy(p,'유사문제 프롬프트를 복사했습니다');
}

/* ── 3) JSON 파일 불러오기 ────────────────────────────── */
function pImport(kind){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let data; try{ data=JSON.parse(r.result) }
      catch(x){ alert('JSON 파일을 읽을 수 없습니다: '+x.message); return }
      const pick=(...keys)=>{
        if(Array.isArray(data))return data;
        for(const k of keys) if(data&&Array.isArray(data[k]))return data[k];
        return null;
      };
      const arr=kind==='note'?pick('notes','prac-notes','studyNotes'):pick('questions','items','prac-drill','drill');
      if(!arr){ alert('JSON 배열을 찾을 수 없습니다. [{...}] 형식의 .json 파일인지 확인하세요'); return }
      const n=kind==='note'?pApplyNotes(arr):pApplyQs(arr);
      if(!n){ alert('불러올 항목이 없습니다'); return }
      save(); toast(n+'개를 저장했습니다'); vPAI({tab:kind==='note'?'note':'gen'});
    };
    r.readAsText(f);
  };
  inp.click();
}
const pArr=v=>Array.isArray(v)?v.map(x=>String(x)).filter(x=>x.trim()):(v?[String(v)]:[]);

function pApplyNotes(arr){
  const P=PA(); let n=0;
  arr.forEach(x=>{
    if(!x||typeof x!=='object')return;
    const concept=String(x.concept||x.summary||'').trim();
    if(!concept)return;
    const tag=String(x.tag||x.title||'').trim()||('ai'+Date.now());
    const prev=P.aiNote[tag]||null;
    P.aiNote[tag]={
      tag:tag, title:String(x.title||tag).trim(), concept:concept,
      memorize:pArr(x.memorize).length?pArr(x.memorize):(prev?prev.memorize:[]),
      compare:pArr(x.compare), myMistake:String(x.myMistake||x.myConfusion||'').trim(),
      drill:pArr(x.drill),
      qids:pArr(x.qids).filter(id=>PD.byId[id]),
      createdAt:prev?prev.createdAt:Date.now(), updatedAt:Date.now()
    };
    n++;
  });
  return n;
}
function pApplyQs(arr){
  const P=PA(); let n=0;
  const seen=new Set(P.aiQ.map(q=>pnK(q.q)+'|'+pnK(q.a)));
  arr.forEach((x,i)=>{
    if(!x||typeof x!=='object')return;
    const q=String(x.q||'').trim(), a=String(x.a==null?'':x.a).trim();
    if(!q||!a)return;
    const key=pnK(q)+'|'+pnK(a);
    if(seen.has(key))return;
    seen.add(key);
    const type=['code','sql','short','fill','order'].indexOf(x.type)>=0?x.type:(x.code?'code':'short');
    P.aiQ.push({
      id:'ai'+Date.now().toString(36)+i, ai:1, exam:'ai', no:P.aiQ.length+1,
      type:type, lang:x.lang||(type==='sql'?'SQL':null),
      q:q, code:x.code?String(x.code):null,
      choices:Array.isArray(x.choices)&&x.choices.length?x.choices.map(String):null,
      a:a, alt:pArr(x.alt), why:String(x.why||'').trim(),
      tags:pArr(x.tags), unit:'', partial:false, createdAt:Date.now()
    });
    n++;
  });
  return n;
}
function pDelNote(tag){
  if(!confirm('이 AI 요약을 삭제할까요?'))return;
  delete PA().aiNote[tag]; save(); vPAI({tab:'note'});
}
function pClearQs(){
  const P=PA();
  if(!P.aiQ.length){toast('저장된 유사문제가 없습니다');return}
  if(!confirm('생성된 유사문제 '+P.aiQ.length+'개를 모두 지울까요?'))return;
  P.aiQ=[]; P.aiAns={}; save(); toast('삭제했습니다'); vPAI({tab:'gen'});
}

/* ── AI 학습 화면 ─────────────────────────────────────── */
let AIF={tab:'diag'};
async function vPAI(a){
  if(!await pLoad())return;
  if(a&&a.tab)AIF.tab=a.tab;
  document.getElementById('hTitle').textContent='취약점 분석 · AI 학습';
  const P=PA(), d=pAiDiag();
  const tabs=[['diag','취약점 분석'],['note','개념 요약 ('+Object.keys(P.aiNote).length+')'],['gen','유사문제 ('+P.aiQ.length+')']];
  app().innerHTML=
    '<div class="frow">'+tabs.map(t=>'<button class="fchip'+(AIF.tab===t[0]?' on':'')+'" onclick="vPAI({tab:\''+t[0]+'\'})">'+t[1]+'</button>').join('')+'</div>'+
    (AIF.tab==='diag'?pDiagView(d):AIF.tab==='note'?pNoteAiView():pGenView())+
    '<div style="height:24px"></div>';
}

function pBars(title,rows,empty){
  if(!rows.length) return '<h2 class="sec">'+title+'</h2><div class="card tight small muted">'+empty+'</div>';
  return '<h2 class="sec">'+title+'</h2><div class="card tight">'+rows.map(x=>
    '<div class="lrow"><div class="g"><b>'+esc(x.k)+'</b>'+
      '<span class="s">'+x.n+'문항 중 '+x.ok+'개 정답</span>'+
      '<div class="mini" style="margin-top:5px"><i style="width:'+x.rate+'%;background:'+
        (x.rate>=70?'var(--ok)':x.rate>=40?'var(--wn)':'var(--no)')+'"></i></div></div>'+
    '<span class="chip" style="color:'+(x.rate>=70?'var(--ok)':x.rate>=40?'var(--wn)':'var(--no)')+
      ';border-color:var(--line)">'+x.rate+'%</span></div>').join('')+'</div>';
}
function pDiagView(d){
  if(!d.n) return '<div class="empty">아직 푼 문제가 없습니다.<br><span class="tiny">기출을 풀면 여기에서 취약점을 분석합니다.</span></div>';
  const weak=d.tags.filter(x=>x.n>=2&&x.rate<80).slice(0,10);
  return '<div class="grid3">'+
    '<div class="kpi"><div class="v">'+d.n+'</div><div class="k">푼 문제</div></div>'+
    '<div class="kpi"><div class="v" style="color:'+(d.rate>=60?'var(--ok)':'var(--wn)')+'">'+d.rate+'%</div><div class="k">정답률</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--no)">'+d.wrong+'</div><div class="k">틀린 문제</div></div>'+
  '</div>'+
  pBars('개념별 정답률',weak,'2문항 이상 푼 개념 중 약한 것이 없습니다.')+
  pBars('유형별 정답률',d.types,'기록이 없습니다.')+
  (d.langs.length?pBars('언어별 정답률',d.langs,''):'')+
  (d.pats.length?'<h2 class="sec">자주 나온 실수</h2><div class="card tight">'+
    d.pats.slice(0,8).map(p=>'<div class="lrow"><div class="g"><b>'+esc(p.k)+'</b></div>'+
      '<span class="chip">'+p.v+'회</span></div>').join('')+'</div>':'')+
  '<div class="card tight" style="margin-top:14px"><div class="small">'+
    '이 분석을 그대로 담아 <b>AI 프롬프트</b>를 만들 수 있습니다. 개념 요약과 유사문제 탭에서 복사하세요.</div></div>';
}

function pNoteAiView(){
  const P=PA(), list=Object.values(P.aiNote).sort((a,b)=>b.updatedAt-a.updatedAt);
  return '<div class="card tight"><div class="small">내 오답과 취약 개념을 정리한 프롬프트를 복사해 Claude·ChatGPT에 붙여넣으면 '+
    '<b>내가 왜 틀렸는지</b>까지 짚은 개념 요약을 <code class="ic">prac-notes.json</code> 파일로 만들어 줍니다. 그 파일을 여기에 올리세요.</div>'+
    '<div class="grid2" style="margin-top:10px">'+
      '<button class="btn sm" onclick="pCopyNotePrompt()">프롬프트 복사</button>'+
      '<button class="btn sm gh" onclick="pImport(\'note\')">prac-notes.json 올리기</button>'+
    '</div></div>'+
  (!list.length?'<div class="empty">아직 불러온 AI 개념 요약이 없습니다.</div>'
   :list.map(n=>'<div class="card">'+
      '<div class="qhd"><span class="chip" style="color:var(--pu);border-color:#463a7a">'+esc(n.tag)+'</span>'+
        '<div style="flex:1"></div><button class="btn sm gh" onclick="pDelNote(\''+n.tag.replace(/'/g,"\\'")+'\')">삭제</button></div>'+
      '<h3 style="margin:9px 0 6px;font-size:16.5px">'+esc(n.title)+'</h3>'+
      '<div class="small" style="line-height:1.75">'+nl2br(n.concept)+'</div>'+
      (n.memorize.length?'<div class="tiny muted" style="margin:11px 0 3px">외울 것</div>'+
        n.memorize.map((m,k)=>'<div class="nrule"><div class="nn">'+(k+1)+'</div><div>'+pMd(m)+'</div></div>').join(''):'')+
      (n.compare.length?'<div class="tiny muted" style="margin:11px 0 3px">헷갈리는 짝</div>'+
        n.compare.map(c=>'<div class="nrule"><div class="nn">vs</div><div>'+pMd(c)+'</div></div>').join(''):'')+
      (n.myMistake?'<div class="ntrap" style="margin-top:11px"><b>내가 틀린 지점</b>'+
        '<div style="margin-top:4px;font-size:14px;line-height:1.72">'+pMd(n.myMistake)+'</div></div>':'')+
      (n.drill.length?'<div class="tiny muted" style="margin:11px 0 3px">스스로 확인</div>'+
        '<div class="outbox" style="font-family:inherit;white-space:pre-wrap">'+n.drill.map(esc).join('\n')+'</div>':'')+
      (n.qids.length?'<div class="tiny muted" style="margin:10px 0 3px">근거가 된 내 오답</div>'+
        n.qids.map(id=>{const q=PD.byId[id];return '<div class="lrow" onclick="go(\'#/pplay?id='+id+'\')" style="cursor:pointer">'+
          '<div class="g"><b>'+esc(examTitle(q.exam))+' '+q.no+'번</b><span class="s">'+
          esc(String(q.q).replace(/\n/g,' ').slice(0,50))+'</span></div><span class="chip">→</span></div>'}).join(''):'')+
    '</div>').join(''));
}

function pGenView(){
  const P=PA(), A=P.aiAns;
  const done=P.aiQ.filter(q=>A[q.id]).length, ok=P.aiQ.filter(q=>A[q.id]&&A[q.id].ok).length;
  return '<div class="card tight"><div class="small">같은 프롬프트 방식으로 <b>내 오답과 같은 개념의 유사문제</b>를 만들 수 있습니다. '+
    'AI가 <code class="ic">prac-drill.json</code> 파일을 만들어 주면 여기에 올려 기출과 똑같은 방식으로 풀 수 있습니다.</div>'+
    '<div class="grid2" style="margin-top:10px">'+
      '<button class="btn sm" onclick="pCopyGenPrompt()">프롬프트 복사</button>'+
      '<button class="btn sm gh" onclick="pImport(\'gen\')">prac-drill.json 올리기</button>'+
    '</div></div>'+
  (!P.aiQ.length?'<div class="empty">아직 불러온 유사문제가 없습니다.</div>'
   :'<div class="card tight"><div class="row small"><div style="flex:1"><b>유사문제 '+P.aiQ.length+'개</b>'+
      pBar(done,ok,P.aiQ.length)+'</div>'+
      '<button class="btn sm" style="margin-left:10px" onclick="go(\'#/paiplay\')">'+(done?'이어풀기':'풀기')+'</button></div></div>'+
    '<div class="card tight">'+P.aiQ.map((q,i)=>{
      const rec=A[q.id];
      return '<div class="lrow" onclick="go(\'#/paiplay?i='+i+'\')" style="cursor:pointer">'+
        '<div class="g"><b>'+(i+1)+'. '+TLABEL[q.type]+(q.lang?' · '+esc(q.lang):'')+'</b>'+
        '<span class="s">'+esc(String(q.q).replace(/\n/g,' ').slice(0,52))+'</span></div>'+
        (rec?'<span class="chip '+(rec.ok?'ok2':'')+'" style="'+(rec.ok?'':'color:var(--no);border-color:#5c2b2b')+'">'+(rec.ok?'○':'✘')+'</span>'
            :'<span class="chip">→</span>')+'</div>';
    }).join('')+'</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn sm gh" onclick="pClearQs()">유사문제 전체 삭제</button></div>');
}

/* ── 유사문제 풀이 (기출과 같은 카드·채점을 그대로 씀) ── */
async function vPAIPlay(a){
  if(!await pLoad())return;
  const P=PA();
  if(!P.aiQ.length){ go('#/pai?tab=gen'); return }
  const A=P.aiAns, first=P.aiQ.findIndex(q=>!A[q.id]);
  PP={list:P.aiQ,i:a&&a.i!=null?+a.i:(first<0?0:first),title:'AI 유사문제',shown:{},from:'#/pai?tab=gen'};
  P.aiQ.forEach(q=>{ if(A[q.id])PP.shown[q.id]=1 });
  pDraw();
}

/* ── 모드 전환 · 내비게이션 ───────────────────────────── */
const PRAC_ROUTES=['phome','pexam','ptype','pplay','pnote','pnv','pwrong','pai','paiplay'];
function isPrac(p){ return PRAC_ROUTES.indexOf(p)>=0 }
function setMode(m){
  try{localStorage.setItem('jbsg_mode',m)}catch(e){}
  go(m==='prac'?'#/phome':'#/home');
}
function curMode(){
  const p=(location.hash||'#/home').split('?')[0].split('/')[1]||'home';
  return isPrac(p)?'prac':'written';
}
const NAV={
  written:[['home','◎','홈'],['exams','✎','기출문제'],['summary','▤','핵심요약'],['analysis','◈','오답분석'],['notes','✦','학습노트']],
  prac:   [['phome','◎','홈'],['pexam','✎','회차별'],['ptype','⌨','유형별'],['pnote','✦','학습노트'],['pwrong','◈','오답노트']]
};
function drawNav(p){
  const m=curMode();
  document.getElementById('navIn').innerHTML=NAV[m].map(x=>
    '<a href="#/'+x[0]+'" data-tab="'+x[0]+'"><i>'+x[1]+'</i>'+x[2]+'</a>').join('');
  const alias={pplay:'pexam',pnv:'pnote',pai:'pwrong',paiplay:'pwrong'};
  const t=alias[p]||p;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',
    a.dataset.tab===t||(m==='written'&&((p==='play'&&a.dataset.tab==='exams')
    ||(['sec','glossary','new'].indexOf(p)>=0&&a.dataset.tab==='summary')
    ||(p==='gen'&&a.dataset.tab==='analysis')||(p==='drill'&&a.dataset.tab==='notes')))));
  const mt=document.getElementById('mTog');
  if(mt) mt.innerHTML='<button class="'+(m==='written'?'on':'')+'" onclick="setMode(\'written\')">필기</button>'+
                      '<button class="'+(m==='prac'?'on':'')+'" onclick="setMode(\'prac\')">실기</button>';
}
